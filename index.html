<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>ABC Fruits - Cold Room</title>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 540px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 30px;
    }

    h2 {
      text-align: center;
      margin: 8px 0 22px;
      font-size: 24px;
    }

    h3 {
      text-align: center;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .scan-button {
      background: #111827;
      color: white;
    }

    .type-button {
      background: #2563eb;
      color: white;
    }

    .check-button {
      background: #059669;
      color: white;
    }

    .back-button {
      background: #6b7280;
      color: white;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 18px;
      margin-top: 10px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 12px;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #f1f5f9;
      line-height: 1.7;
      font-size: 16px;
    }

    .success {
      color: #047857;
      font-weight: bold;
    }

    .error {
      color: #b91c1c;
      font-weight: bold;
    }

    .info {
      color: #1d4ed8;
      font-weight: bold;
    }

    .details {
      margin-top: 12px;
      line-height: 2;
    }

    .hidden {
      display: none !important;
    }

    .label {
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="card">

  <!-- =====================================
       HEADER
       ===================================== -->

  <h1>🍎 ABC Fruits</h1>

  <h2>❄️ Cold Room</h2>


  <!-- =====================================
       METHOD SCREEN
       ===================================== -->

  <div id="methodScreen">

    <h3>Select Pallet Entry Method</h3>

    <button
      class="scan-button"
      onclick="startScanner()">

      📷 SCAN PALLET QR

    </button>


    <button
      class="type-button"
      onclick="openTypeScreen()">

      ⌨️ TYPE PALLET ID

    </button>

  </div>


  <!-- =====================================
       CAMERA SCREEN
       ===================================== -->

  <div
    id="cameraScreen"
    class="hidden">

    <div id="reader"></div>

    <button
      class="back-button"
      onclick="stopScanner()">

      ✖ CLOSE CAMERA

    </button>

  </div>


  <!-- =====================================
       TYPE SCREEN
       ===================================== -->

  <div
    id="typeScreen"
    class="hidden">

    <h3>Enter Pallet ID</h3>

    <input
      id="palletInput"
      type="text"
      placeholder="PAL-000001"
      autocomplete="off"
      autocapitalize="characters">

    <button
      class="check-button"
      onclick="submitTypedPallet()">

      🔍 CHECK PALLET

    </button>

    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =====================================
       CAPTURED SCREEN
       ===================================== -->

  <div
    id="capturedScreen"
    class="hidden">

    <div class="result">

      <div class="success">
        ✅ PALLET ID CAPTURED
      </div>

      <br>

      <span class="label">
        Pallet ID:
      </span>

      <span id="capturedPallet">
      </span>

    </div>

    <button
      class="check-button"
      onclick="getPalletData()">

      🔍 CHECK PALLET

    </button>

    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =====================================
       PALLET DETAILS
       ===================================== -->

  <div
    id="detailsScreen"
    class="hidden">

    <div class="result">

      <div class="success">
        ✅ PALLET FOUND
      </div>

      <div
        id="palletDetails"
        class="details">
      </div>

    </div>

    <!-- LOCATION WILL BE ADDED LATER -->

    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =====================================
       MESSAGE
       ===================================== -->

  <div
    id="message"
    class="result">

    Select Scan or Type Pallet ID.

  </div>

</div>


<script>

/************************************************
 * ABC FRUITS PALLET SCANNER
 ************************************************/


/************************************************
 * YOUR WORKING APPS SCRIPT WEB APP
 ************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbyCTjHaU-7Md7FWXv1NxcTnJvt934LZ0c9KbyHyxEB92LERxjWzf1XcUBeRAX7fhImX/exec";


/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let selectedPalletId = "";

let palletData = null;


/************************************************
 * START CAMERA
 ************************************************/

function startScanner() {

  hideAllScreens();

  document
    .getElementById("cameraScreen")
    .classList.remove("hidden");


  setMessage(
    "📷 Opening live camera...",
    "info"
  );


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      /*
       * QR contains:
       *
       * PAL-000001
       */

      selectedPalletId =
        String(decodedText)
          .trim()
          .toUpperCase();


      stopScanner();


      showCapturedPallet();

    },

    function(errorMessage) {

      /*
       * Ignore normal QR scanning messages.
       */

    }

  )

  .catch(function(error) {

    setMessage(
      "❌ Camera error: " +
      String(error),
      "error"
    );

  });

}


/************************************************
 * STOP CAMERA
 ************************************************/

function stopScanner() {

  if (scanner) {

    scanner
      .stop()

      .then(function() {

        try {

          scanner.clear();

        } catch (e) {}

        scanner = null;

      })

      .catch(function() {

        scanner = null;

      });

  }


  document
    .getElementById("cameraScreen")
    .classList.add("hidden");

}


/************************************************
 * OPEN TYPE SCREEN
 ************************************************/

function openTypeScreen() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById("typeScreen")
    .classList.remove("hidden");


  const input =
    document.getElementById(
      "palletInput"
    );


  input.value = "";


  setMessage(
    "Enter Pallet ID.",
    "info"
  );


  setTimeout(function() {

    input.focus();

  }, 200);

}


/************************************************
 * TYPE PALLET
 ************************************************/

function submitTypedPallet() {

  let value =
    document
      .getElementById(
        "palletInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (!value) {

    setMessage(
      "❌ Please enter Pallet ID.",
      "error"
    );

    return;

  }


  selectedPalletId =
    value;


  showCapturedPallet();

}


/************************************************
 * SHOW CAPTURED PALLET
 ************************************************/

function showCapturedPallet() {

  hideAllScreens();


  document
    .getElementById(
      "capturedScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "capturedPallet"
    )
    .innerText =
      selectedPalletId;


  setMessage(
    "Pallet ID captured successfully.",
    "info"
  );

}


/************************************************
 * GET PALLET FROM APPS SCRIPT
 *
 * Uses JSONP because GitHub Pages
 * cannot directly read normal Apps Script
 * responses because of browser CORS.
 ************************************************/

function getPalletData() {

  if (!selectedPalletId) {

    setMessage(
      "❌ Pallet ID is empty.",
      "error"
    );

    return;

  }


  hideAllScreens();


  setMessage(
    "🔍 Checking " +
    escapeHtml(
      selectedPalletId
    ) +
    "...",
    "info"
  );


  /*
   * Create unique callback name
   */

  const callbackName =
    "abcPallet_" +
    Date.now();


  /*
   * Create global callback
   */

  window[callbackName] =
    function(data) {

      console.log(
        "ABC Fruits API response:",
        data
      );


      /*
       * API SUCCESS
       */

      if (
        data &&
        data.ok === true
      ) {

        palletData =
          data;


        showPalletDetails(
          data
        );


        cleanup();

        return;

      }


      /*
       * API ERROR
       */

      setMessage(
        "❌ " +
        (
          data &&
          data.message
            ? data.message
            : "Pallet not found."
        ),
        "error"
      );


      showCapturedPallet();


      cleanup();

    };


  /*
   * =========================================
   * IMPORTANT
   *
   * Your Apps Script endpoint:
   *
   * /exec/pallet/PAL-000001
   *
   * JSONP:
   *
   * ?prefix=callback
   * =========================================
   */

  const requestUrl =
    API_URL +
    "/pallet/" +
    encodeURIComponent(
      selectedPalletId
    ) +
    "?prefix=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "Request URL:",
    requestUrl
  );


  /*
   * Create SCRIPT request.
   *
   * This is JSONP.
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    requestUrl;


  script.async = true;


  /*
   * Network error
   */

  script.onerror =
    function() {

      setMessage(
        "❌ Apps Script request failed.",
        "error"
      );


      showCapturedPallet();


      cleanup();

    };


  /*
   * Add request to page
   */

  document
    .body
    .appendChild(
      script
    );


  /*
   * Timeout
   */

  setTimeout(
    function() {

      const existing =
        document.getElementById(
          callbackName
        );


      if (existing) {

        setMessage(
          "❌ Apps Script did not respond.",
          "error"
        );


        showCapturedPallet();


        cleanup();

      }

    },
    15000
  );


  /*
   * Cleanup
   */

  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SHOW PALLET DETAILS
 ************************************************/

function showPalletDetails(
  data
) {

  hideAllScreens();


  document
    .getElementById(
      "detailsScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "palletDetails"
    )
    .innerHTML =

      "<b>Pallet ID:</b> " +
      safe(data.palletId) +

      "<br>" +

      "<b>Batch ID:</b> " +
      safe(data.batchId) +

      "<br>" +

      "<b>Product:</b> " +
      safe(data.product) +

      "<br>" +

      "<b>Production Date:</b> " +
      safe(data.productionDate) +

      "<br>" +

      "<b>Box Weight:</b> " +
      safe(data.boxWeightKG) +
      " KG" +

      "<br>" +

      "<b>Original Boxes:</b> " +
      safe(data.originalBoxes) +

      "<br>" +

      "<b>Current Boxes:</b> " +
      safe(data.currentBoxes) +

      "<br>" +

      "<b>Current KG:</b> " +
      safe(data.currentKG) +
      " KG" +

      "<br>" +

      "<b>Current Room:</b> " +
      safe(
        data.currentRoom || "-"
      ) +

      "<br>" +

      "<b>Current Location:</b> " +
      safe(
        data.currentLocation || "-"
      ) +

      "<br>" +

      "<b>Status:</b> " +
      safe(data.status);


  setMessage(
    "✅ Pallet data loaded successfully.",
    "success"
  );

}


/************************************************
 * HOME
 ************************************************/

function goHome() {

  stopScanner();


  selectedPalletId = "";

  palletData = null;


  hideAllScreens();


  document
    .getElementById(
      "methodScreen"
    )
    .classList.remove(
      "hidden"
    );


  setMessage(
    "Select Scan or Type Pallet ID.",
    "info"
  );

}


/************************************************
 * HIDE ALL SCREENS
 ************************************************/

function hideAllScreens() {

  document
    .getElementById(
      "methodScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "cameraScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "typeScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "capturedScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "detailsScreen"
    )
    .classList.add(
      "hidden"
    );

}


/************************************************
 * MESSAGE
 ************************************************/

function setMessage(
  message,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML =
    message;


  box.className =
    "result";


  if (
    type === "success"
  ) {

    box.classList.add(
      "success"
    );

  }

  else if (
    type === "error"
  ) {

    box.classList.add(
      "error"
    );

  }

  else {

    box.classList.add(
      "info"
    );

  }

}


/************************************************
 * SAFE HTML
 ************************************************/

function safe(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
