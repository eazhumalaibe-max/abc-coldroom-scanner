<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>ABC Fruits Cold Room Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 15px;
    }

    .card {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 2px 12px #0002;
    }

    h1, h2 {
      text-align: center;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .scan {
      background: #111827;
      color: white;
    }

    .close {
      background: #6b7280;
      color: white;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #f1f5f9;
      line-height: 1.8;
      font-size: 16px;
    }

    .success {
      color: #047857;
      font-weight: bold;
      font-size: 19px;
    }

    .error {
      color: #b91c1c;
      font-weight: bold;
    }

    .info {
      color: #1d4ed8;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

  </style>

</head>

<body>

<div class="card">

  <h1>🍎 ABC Fruits</h1>

  <h2>❄️ Cold Room Scanner</h2>

  <button
    class="scan"
    onclick="startScanner()">
    📷 SCAN PALLET QR
  </button>

  <div id="reader"></div>

  <button
    id="closeButton"
    class="close hidden"
    onclick="stopScanner()">
    ✖ CLOSE CAMERA
  </button>

  <div id="result" class="result">
    Ready to scan pallet QR.
  </div>

</div>


<script>

/************************************************
 * ABC FRUITS APPS SCRIPT URL
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbwcKf7tvHMhWAazmLMj7jUuKfxGnJ-NnJfIhOXL08dGDeGS1LNDXcJka6jTM11yBvzk/exec";


let scanner = null;


/************************************************
 * START LIVE CAMERA
 ************************************************/

function startScanner() {

  document.getElementById("result").innerHTML =
    '<span class="info">📷 Opening live camera...</span>';

  document
    .getElementById("closeButton")
    .classList.remove("hidden");


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      // QR detected

      stopScanner();

      checkPallet(decodedText);

    },

    function(errorMessage) {

      // Normal scanning messages.
      // Nothing needs to be displayed.

    }

  ).catch(function(error) {

    showError(
      "Camera error: " + error
    );

  });
}


/************************************************
 * STOP CAMERA
 ************************************************/

function stopScanner() {

  if (!scanner) {

    document
      .getElementById("closeButton")
      .classList.add("hidden");

    return;
  }


  scanner.stop()
    .then(function() {

      scanner.clear();

      scanner = null;

    })
    .catch(function() {

      scanner = null;

    });


  document
    .getElementById("closeButton")
    .classList.add("hidden");
}


/************************************************
 * CHECK PALLET
 ************************************************/

function checkPallet(palletId) {

  palletId =
    String(palletId || "").trim();


  if (!palletId) {

    showError(
      "Pallet QR is empty."
    );

    return;
  }


  document.getElementById("result").innerHTML =
    '<span class="info">' +
    "🔍 Checking pallet <b>" +
    escapeHtml(palletId) +
    "</b>..." +
    "</span>";


  /*
   * Create a unique callback function.
   */

  const callbackName =
    "abcPalletCallback_" +
    Date.now();


  /*
   * Create the callback.
   */

  window[callbackName] =
    function(response) {

      console.log(
        "ABC Fruits response:",
        response
      );


      if (
        response &&
        response.ok === true
      ) {

        showPallet(response);

      } else {

        showError(
          response &&
          response.message
            ? response.message
            : "Pallet not found."
        );
      }


      cleanup();
    };


  /*
   * Build JSONP URL.
   *
   * IMPORTANT:
   * The Apps Script backend uses
   * "prefix".
   */

  const url =
    API_URL +
    "?action=getPallet" +
    "&palletId=" +
    encodeURIComponent(palletId) +
    "&prefix=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  console.log(
    "Requesting:",
    url
  );


  /*
   * Create script tag.
   *
   * This allows the browser to follow
   * Google's Apps Script response.
   */

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    url;


  script.onload =
    function() {

      console.log(
        "Apps Script response loaded."
      );

    };


  script.onerror =
    function() {

      showError(
        "Apps Script request failed."
      );

      cleanup();

    };


  document
    .body
    .appendChild(script);


  /*
   * 15-second timeout.
   */

  setTimeout(function() {

    if (
      document.getElementById(
        callbackName
      )
    ) {

      showError(
        "No response from Apps Script."
      );

      cleanup();

    }

  }, 15000);


  /*
   * Remove temporary callback/script.
   */

  function cleanup() {

    try {

      delete window[callbackName];

    } catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }
  }
}


/************************************************
 * SHOW PALLET
 ************************************************/

function showPallet(data) {

  document.getElementById("result").innerHTML =

    '<div class="success">' +
    "✅ PALLET FOUND" +
    "</div>" +

    "<br>" +

    "<b>Pallet ID:</b> " +
    safe(data.palletId) +

    "<br>" +

    "<b>Product:</b> " +
    safe(data.product) +

    "<br>" +

    "<b>Batch:</b> " +
    safe(data.batchId) +

    "<br>" +

    "<b>Box Weight:</b> " +
    safe(data.boxWeight) +
    " KG" +

    "<br>" +

    "<b>Original Boxes:</b> " +
    safe(data.originalBoxes) +

    "<br>" +

    "<b>Current Boxes:</b> " +
    safe(data.currentBoxes) +

    "<br>" +

    "<b>Current KG:</b> " +
    safe(data.currentKG) +
    " KG" +

    "<br>" +

    "<b>Cold Room:</b> " +
    safe(data.currentRoom) +

    "<br>" +

    "<b>Location:</b> " +
    safe(data.currentLocation) +

    "<br>" +

    "<b>Status:</b> " +
    safe(data.status);
}


/************************************************
 * SHOW ERROR
 ************************************************/

function showError(message) {

  document.getElementById("result").innerHTML =

    '<span class="error">' +
    "❌ " +
    escapeHtml(message) +
    "</span>";
}


/************************************************
 * SAFE DISPLAY
 ************************************************/

function safe(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";
  }

  return escapeHtml(
    String(value)
  );
}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}

</script>

</body>
</html>
