<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ABC Fruits Cold Room Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  margin: 0;
  padding: 15px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 2px 12px #0002;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  text-align: center;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.scanButton {
  background: #111827;
  color: white;
}

.typeButton {
  background: #2563eb;
  color: white;
}

.checkButton {
  background: #059669;
  color: white;
}

.closeButton {
  background: #6b7280;
  color: white;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 18px;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

.result {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: #f1f5f9;
  line-height: 1.8;
}

.success {
  color: #047857;
  font-weight: bold;
}

.error {
  color: #b91c1c;
  font-weight: bold;
}

.info {
  color: #1d4ed8;
  font-weight: bold;
}

.hidden {
  display: none;
}

.palletCard {
  margin-top: 15px;
  padding: 16px;
  background: #ecfdf5;
  border-radius: 12px;
  line-height: 1.8;
}

</style>

</head>

<body>

<div class="card">

<h1>🍎 ABC Fruits</h1>

<h2>❄️ Cold Room Scanner</h2>


<!-- =========================================
     METHOD SCREEN
     ========================================= -->

<div id="methodScreen">

  <h3>Select Pallet Entry Method</h3>

  <button
    class="scanButton"
    onclick="startScanner()">

    📷 SCAN PALLET QR

  </button>


  <button
    class="typeButton"
    onclick="showTypeScreen()">

    ⌨️ TYPE PALLET ID

  </button>

</div>


<!-- =========================================
     LIVE CAMERA
     ========================================= -->

<div
  id="scannerScreen"
  class="hidden">

  <div id="reader"></div>

  <button
    class="closeButton"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>

</div>


<!-- =========================================
     TYPE SCREEN
     ========================================= -->

<div
  id="typeScreen"
  class="hidden">

  <h3>Enter Pallet ID</h3>

  <input
    id="palletInput"
    type="text"
    placeholder="Example: PAL-000001"
    autocomplete="off"
    autocapitalize="characters">

  <button
    class="checkButton"
    onclick="submitTypedPallet()">

    CHECK PALLET

  </button>

  <button
    class="closeButton"
    onclick="backToMethod()">

    ← BACK

  </button>

</div>


<!-- =========================================
     RESULT
     ========================================= -->

<div
  id="resultScreen"
  class="hidden">

  <div
    id="result"
    class="palletCard">
  </div>

  <button
    class="checkButton"
    onclick="checkPalletAgain()">

    🔍 CHECK AGAIN

  </button>

  <button
    class="closeButton"
    onclick="backToMethod()">

    ← BACK

  </button>

</div>


<!-- =========================================
     MESSAGE
     ========================================= -->

<div
  id="message"
  class="result">

  Select Scan or Type Pallet ID.

</div>

</div>


<script>


/************************************************
 * APPS SCRIPT URL
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycby7fNvS6UhyUGZ5SCohrUIy859dZ2LaKcyaFbOeZSV9pWPwC7Cd7G8bzV134jQXpgdb/exec";


/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let selectedPalletId = "";

let requestTimeout = null;


/************************************************
 * START LIVE CAMERA
 ************************************************/

function startScanner() {

  document
    .getElementById("methodScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

  document
    .getElementById("scannerScreen")
    .classList.remove("hidden");


  document
    .getElementById("message")
    .innerHTML =
      '<span class="info">' +
      '📷 Opening live camera...' +
      '</span>';


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      selectedPalletId =
        String(decodedText)
        .trim();


      stopScanner();


      loadPallet(
        selectedPalletId
      );

    },

    function(errorMessage) {

      // Ignore normal scanning messages

    }

  )

  .catch(function(error) {

    showError(
      "Camera error: " +
      error
    );

  });

}


/************************************************
 * STOP CAMERA
 ************************************************/

function stopScanner() {

  if (!scanner) {

    document
      .getElementById("scannerScreen")
      .classList.add("hidden");

    return;

  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });


  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

}


/************************************************
 * TYPE SCREEN
 ************************************************/

function showTypeScreen() {

  document
    .getElementById("methodScreen")
    .classList.add("hidden");

  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.remove("hidden");


  document
    .getElementById("palletInput")
    .value = "";


  document
    .getElementById("palletInput")
    .focus();

}


/************************************************
 * TYPED PALLET
 ************************************************/

function submitTypedPallet() {

  const value =
    document
      .getElementById("palletInput")
      .value
      .trim();


  if (!value) {

    showError(
      "Please enter Pallet ID."
    );

    return;

  }


  selectedPalletId =
    value.toUpperCase();


  loadPallet(
    selectedPalletId
  );

}


/************************************************
 * LOAD PALLET
 ************************************************/

function loadPallet(palletId) {

  if (!palletId) {

    showError(
      "Pallet ID is empty."
    );

    return;

  }


  document
    .getElementById("methodScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  document
    .getElementById("result")
    .innerHTML =
      '<span class="info">' +
      '🔍 Checking pallet <b>' +
      escapeHtml(palletId) +
      '</b>...' +
      '</span>';


  document
    .getElementById("message")
    .innerHTML =
      "Connecting to ABC Fruits inventory...";


  /*
   * Unique JSONP callback
   */

  const callbackName =
    "abcPallet_" +
    Date.now();


  /*
   * Create callback
   */

  window[callbackName] =
    function(data) {

      clearTimeout(
        requestTimeout
      );


      console.log(
        "ABC Fruits API response:",
        data
      );


      if (
        data &&
        data.ok === true
      ) {

        showPallet(
          data
        );

      }

      else {

        showError(
          data &&
          data.message
            ? data.message
            : "Pallet not found."
        );

      }


      cleanup();

    };


  /*
   * Build API URL
   */

  const url =
    API_URL +
    "?action=getPallet" +
    "&palletId=" +
    encodeURIComponent(
      palletId
    ) +
    "&prefix=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  console.log(
    "API URL:",
    url
  );


  /*
   * JSONP script
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    url;


  script.async = true;


  script.onerror =
    function() {

      clearTimeout(
        requestTimeout
      );


      showError(
        "Could not connect to ABC Fruits server."
      );


      cleanup();

    };


  document
    .body
    .appendChild(
      script
    );


  /*
   * Timeout
   */

  requestTimeout =
    setTimeout(
      function() {

        if (
          document.getElementById(
            callbackName
          )
        ) {

          showError(
            "No response from Apps Script."
          );

          cleanup();

        }

      },
      15000
    );


  /*
   * Cleanup
   */

  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SHOW PALLET
 ************************************************/

function showPallet(data) {

  document
    .getElementById("result")
    .innerHTML =

      '<div class="success">' +
      '✅ PALLET FOUND' +
      '</div>' +

      '<br>' +

      '<b>Pallet ID:</b> ' +
      safe(data.palletId) +

      '<br>' +

      '<b>Product:</b> ' +
      safe(data.product) +

      '<br>' +

      '<b>Batch:</b> ' +
      safe(data.batchId) +

      '<br>' +

      '<b>Box Weight:</b> ' +
      safe(data.boxWeight) +
      ' KG' +

      '<br>' +

      '<b>Original Boxes:</b> ' +
      safe(data.originalBoxes) +

      '<br>' +

      '<b>Current Boxes:</b> ' +
      safe(data.currentBoxes) +

      '<br>' +

      '<b>Current KG:</b> ' +
      safe(data.currentKG) +

      ' KG' +

      '<br>' +

      '<b>Cold Room:</b> ' +
      safe(data.currentRoom) +

      '<br>' +

      '<b>Location:</b> ' +
      safe(data.currentLocation) +

      '<br>' +

      '<b>Status:</b> ' +
      safe(data.status);


  document
    .getElementById("message")
    .innerHTML =
      '<span class="success">' +
      '✅ Data loaded from Google Sheet' +
      '</span>';

}


/************************************************
 * CHECK AGAIN
 ************************************************/

function checkPalletAgain() {

  loadPallet(
    selectedPalletId
  );

}


/************************************************
 * BACK
 ************************************************/

function backToMethod() {

  stopScanner();


  document
    .getElementById("methodScreen")
    .classList.remove("hidden");

  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");


  document
    .getElementById("message")
    .innerHTML =
      "Select Scan or Type Pallet ID.";

}


/************************************************
 * ERROR
 ************************************************/

function showError(message) {

  document
    .getElementById("resultScreen")
    .classList.remove("hidden");

  document
    .getElementById("result")
    .innerHTML =
      '<span class="error">' +
      '❌ ' +
      escapeHtml(message) +
      '</span>';

}


/************************************************
 * SAFE TEXT
 ************************************************/

function safe(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


/************************************************
 * ESCAPE HTML
 ************************************************/

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
