<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ABC Fruits Cold Room Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  margin: 0;
  padding: 15px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 2px 12px #0002;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  text-align: center;
  margin-top: 5px;
}

h3 {
  margin-top: 20px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.scanButton {
  background: #111827;
  color: white;
}

.typeButton {
  background: #2563eb;
  color: white;
}

.testButton {
  background: #7c3aed;
  color: white;
}

.closeButton {
  background: #6b7280;
  color: white;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 18px;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

.result {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: #f1f5f9;
  line-height: 1.8;
  word-break: break-word;
}

.success {
  color: #047857;
  font-weight: bold;
}

.error {
  color: #b91c1c;
  font-weight: bold;
}

.info {
  color: #1d4ed8;
  font-weight: bold;
}

.hidden {
  display: none;
}

.palletCard {
  margin-top: 15px;
  padding: 16px;
  background: #ecfdf5;
  border-radius: 12px;
  line-height: 1.8;
}

.small {
  font-size: 13px;
  color: #6b7280;
  margin-top: 10px;
}

</style>

</head>


<body>

<div class="card">

<h1>🍎 ABC Fruits</h1>

<h2>❄️ Cold Room Scanner</h2>


<!-- =========================================
     MAIN SCREEN
     ========================================= -->

<div id="mainScreen">

  <h3>Select Pallet Entry</h3>


  <button
    class="scanButton"
    onclick="startScanner()">

    📷 SCAN PALLET QR

  </button>


  <button
    class="typeButton"
    onclick="showTypeScreen()">

    ⌨️ TYPE PALLET ID

  </button>


  <button
    class="testButton"
    onclick="testGoogleConnection()">

    🔗 TEST GOOGLE CONNECTION

  </button>

</div>


<!-- =========================================
     CAMERA SCREEN
     ========================================= -->

<div
  id="scannerScreen"
  class="hidden">

  <div id="reader"></div>


  <button
    class="closeButton"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>

</div>


<!-- =========================================
     TYPE SCREEN
     ========================================= -->

<div
  id="typeScreen"
  class="hidden">

  <h3>Enter Pallet ID</h3>


  <input
    id="palletInput"
    type="text"
    placeholder="Example: PAL-000001"
    autocomplete="off"
    autocapitalize="characters">


  <button
    class="typeButton"
    onclick="submitTypedPallet()">

    🔍 CHECK PALLET

  </button>


  <button
    class="closeButton"
    onclick="backHome()">

    ← BACK

  </button>

</div>


<!-- =========================================
     RESULT SCREEN
     ========================================= -->

<div
  id="resultScreen"
  class="hidden">

  <div
    id="result"
    class="result">
  </div>


  <button
    class="typeButton"
    onclick="backHome()">

    ← SCAN ANOTHER PALLET

  </button>

</div>


<!-- =========================================
     MESSAGE
     ========================================= -->

<div
  id="message"
  class="result">

  Ready.

</div>


<div class="small">

  ABC Fruits Inventory System

</div>


</div>


<script>


/************************************************
 * GOOGLE APPS SCRIPT URL
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbxMKcJocdPur7V9D2SUd3TQGElzHIcuuzOhNHjKAnedSjuRimGwgZ4z8MOJftSi8t7G/exec";


/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let currentPallet = "";

let requestTimer = null;


/************************************************
 * START CAMERA
 ************************************************/

function startScanner() {

  hideAllScreens();

  document
    .getElementById("scannerScreen")
    .classList.remove("hidden");


  setMessage(
    "📷 Opening live camera..."
  );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      currentPallet =
        String(decodedText)
          .trim()
          .toUpperCase();


      stopScanner();


      loadPallet(
        currentPallet
      );

    },

    function(errorMessage) {

      // Normal QR scanning messages ignored

    }

  )

  .catch(function(error) {

    showError(
      "Camera error: " +
      error
    );

  });

}


/************************************************
 * STOP CAMERA
 ************************************************/

function stopScanner() {

  if (
    scanner === null
  ) {

    document
      .getElementById("scannerScreen")
      .classList.add("hidden");

    return;

  }


  scanner
    .stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });


  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

}


/************************************************
 * TYPE SCREEN
 ************************************************/

function showTypeScreen() {

  hideAllScreens();


  document
    .getElementById("typeScreen")
    .classList.remove("hidden");


  const input =
    document.getElementById(
      "palletInput"
    );


  input.value = "";


  input.focus();


  setMessage(
    "Enter Pallet ID."
  );

}


/************************************************
 * SUBMIT TYPED PALLET
 ************************************************/

function submitTypedPallet() {

  const input =
    document.getElementById(
      "palletInput"
    );


  const value =
    input.value
      .trim()
      .toUpperCase();


  if (!value) {

    showError(
      "Please enter Pallet ID."
    );

    return;

  }


  currentPallet =
    value;


  loadPallet(
    currentPallet
  );

}


/************************************************
 * LOAD PALLET
 ************************************************/

function loadPallet(
  palletId
) {

  hideAllScreens();


  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  document
    .getElementById("result")
    .innerHTML =

      '<span class="info">' +

      '🔍 Checking pallet ' +

      '<b>' +

      escapeHtml(
        palletId
      ) +

      '</b>...' +

      '</span>';


  setMessage(
    "Connecting to Google Sheet..."
  );


  /*
   * Unique callback
   */

  const callbackName =
    "abcPallet_" +
    Date.now();


  /*
   * Create callback FIRST
   */

  window[callbackName] =
    function(data) {

      console.log(
        "GOOGLE RESPONSE:",
        data
      );


      clearTimeout(
        requestTimer
      );


      if (
        data &&
        data.ok === true
      ) {

        showPallet(
          data
        );

      }

      else {

        showError(

          data &&
          data.message

            ? data.message

            : "Pallet not found."

        );

      }


      removeRequest(
        callbackName
      );

    };


  /*
   * Build JSONP URL
   */

  const requestUrl =

    API_URL +

    "?action=getPallet" +

    "&palletId=" +

    encodeURIComponent(
      palletId
    ) +

    "&prefix=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  console.log(
    "REQUEST URL:",
    requestUrl
  );


  /*
   * Create script
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.type =
    "text/javascript";


  script.async =
    true;


  script.src =
    requestUrl;


  /*
   * Browser script error
   */

  script.onerror =
    function() {

      clearTimeout(
        requestTimer
      );


      showError(

        "Google Apps Script could not be loaded." +

        "<br><br>" +

        "<b>Request:</b><br>" +

        escapeHtml(
          requestUrl
        )

      );


      removeRequest(
        callbackName
      );

    };


  document
    .head
    .appendChild(
      script
    );


  /*
   * Timeout
   */

  requestTimer =
    setTimeout(
      function() {

        if (
          typeof window[
            callbackName
          ] === "function"
        ) {

          showError(

            "Google Apps Script did not return a response within 15 seconds."

          );


          removeRequest(
            callbackName
          );

        }

      },
      15000
    );

}


/************************************************
 * TEST GOOGLE CONNECTION
 ************************************************/

function testGoogleConnection() {

  hideAllScreens();


  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  document
    .getElementById("result")
    .innerHTML =

      '<span class="info">' +

      '🔗 Testing Google Apps Script...' +

      '</span>';


  setMessage(
    "Testing Google Sheet connection..."
  );


  const callbackName =
    "testCallback_" +
    Date.now();


  /*
   * Callback
   */

  window[callbackName] =
    function(data) {

      console.log(
        "TEST RESPONSE:",
        data
      );


      clearTimeout(
        requestTimer
      );


      if (
        data &&
        data.ok === true
      ) {

        document
          .getElementById("result")
          .innerHTML =

            '<div class="success">' +

            '✅ GOOGLE CONNECTION WORKING' +

            '</div>' +

            '<br>' +

            '<b>Pallet ID:</b> ' +

            safe(
              data.palletId
            ) +

            '<br>' +

            '<b>Product:</b> ' +

            safe(
              data.product
            ) +

            '<br>' +

            '<b>Batch:</b> ' +

            safe(
              data.batchId
            );


        setMessage(
          "✅ Google Sheet connection successful."
        );

      }

      else {

        showError(

          data &&
          data.message

            ? data.message

            : "Google connection failed."

        );

      }


      removeRequest(
        callbackName
      );

    };


  /*
   * Exact known-working API call
   */

  const requestUrl =

    API_URL +

    "?action=getPallet" +

    "&palletId=PAL-000001" +

    "&prefix=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  console.log(
    "TEST URL:",
    requestUrl
  );


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.type =
    "text/javascript";


  script.async =
    true;


  script.src =
    requestUrl;


  script.onerror =
    function() {

      clearTimeout(
        requestTimer
      );


      showError(

        "Browser could not load the Google Apps Script request."

      );


      removeRequest(
        callbackName
      );

    };


  document
    .head
    .appendChild(
      script
    );


  requestTimer =
    setTimeout(
      function() {

        if (
          typeof window[
            callbackName
          ] === "function"
        ) {

          showError(

            "Google Apps Script response timeout."

          );


          removeRequest(
            callbackName
          );

        }

      },
      15000
    );

}


/************************************************
 * SHOW PALLET DATA
 ************************************************/

function showPallet(
  data
) {

  document
    .getElementById("result")
    .innerHTML =

      '<div class="success">' +

      '✅ PALLET FOUND' +

      '</div>' +

      '<br>' +

      '<b>Pallet ID:</b> ' +

      safe(
        data.palletId
      ) +

      '<br>' +

      '<b>Product:</b> ' +

      safe(
        data.product
      ) +

      '<br>' +

      '<b>Batch:</b> ' +

      safe(
        data.batchId
      ) +

      '<br>' +

      '<b>Box Weight:</b> ' +

      safe(
        data.boxWeight
      ) +

      ' KG' +

      '<br>' +

      '<b>Original Boxes:</b> ' +

      safe(
        data.originalBoxes
      ) +

      '<br>' +

      '<b>Current Boxes:</b> ' +

      safe(
        data.currentBoxes
      ) +

      '<br>' +

      '<b>Current KG:</b> ' +

      safe(
        data.currentKG
      ) +

      ' KG' +

      '<br>' +

      '<b>Cold Room:</b> ' +

      safe(
        data.currentRoom
      ) +

      '<br>' +

      '<b>Location:</b> ' +

      safe(
        data.currentLocation
      ) +

      '<br>' +

      '<b>Status:</b> ' +

      safe(
        data.status
      );


  setMessage(
    "✅ Google Sheet data loaded successfully."
  );

}


/************************************************
 * REMOVE REQUEST
 ************************************************/

function removeRequest(
  callbackName
) {

  try {

    delete window[
      callbackName
    ];

  }

  catch (error) {

    console.log(
      error
    );

  }


  const script =
    document.getElementById(
      callbackName
    );


  if (script) {

    script.remove();

  }

}


/************************************************
 * ERROR
 ************************************************/

function showError(
  message
) {

  hideAllScreens();


  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  document
    .getElementById("result")
    .innerHTML =

      '<span class="error">' +

      '❌ ' +

      message +

      '</span>';


  setMessage(
    "Connection failed."
  );

}


/************************************************
 * HOME
 ************************************************/

function backHome() {

  stopScanner();


  hideAllScreens();


  document
    .getElementById("mainScreen")
    .classList.remove("hidden");


  document
    .getElementById("message")
    .innerHTML =
      "Ready.";

}


/************************************************
 * HIDE ALL SCREENS
 ************************************************/

function hideAllScreens() {

  document
    .getElementById("mainScreen")
    .classList.add("hidden");

  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

}


/************************************************
 * MESSAGE
 ************************************************/

function setMessage(
  message
) {

  document
    .getElementById("message")
    .innerHTML =
      message;

}


/************************************************
 * SAFE VALUE
 ************************************************/

function safe(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


/************************************************
 * ESCAPE HTML
 ************************************************/

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
