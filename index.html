<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>ABC Fruits - Cold Room</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 32px;
    }

    h2 {
      text-align: center;
      margin: 8px 0 22px;
      font-size: 25px;
    }

    h3 {
      text-align: center;
      margin: 15px 0;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .scan-button {
      background: #111827;
      color: white;
    }

    .type-button {
      background: #2563eb;
      color: white;
    }

    .check-button {
      background: #059669;
      color: white;
    }

    .back-button {
      background: #6b7280;
      color: white;
    }

    .close-camera-button {
      background: #6b7280;
      color: white;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 12px;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #f1f5f9;
      line-height: 1.7;
      font-size: 16px;
    }

    .success {
      color: #047857;
      font-weight: bold;
    }

    .error {
      color: #b91c1c;
      font-weight: bold;
    }

    .info {
      color: #1d4ed8;
      font-weight: bold;
    }

    .details {
      margin-top: 12px;
      line-height: 2;
    }

    .hidden {
      display: none !important;
    }

    .label {
      font-weight: bold;
    }

    .status {
      font-weight: bold;
    }

  </style>

</head>


<body>


<div class="card">


  <!-- =====================================
       HEADER
       ===================================== -->

  <h1>🍎 ABC Fruits</h1>

  <h2>❄️ Cold Room</h2>


  <!-- =====================================
       STEP 1 - SELECT METHOD
       ===================================== -->

  <div id="methodScreen">

    <h3>Select Pallet Entry Method</h3>


    <button
      class="scan-button"
      onclick="startPalletScanner()">

      📷 SCAN PALLET QR

    </button>


    <button
      class="type-button"
      onclick="openTypeScreen()">

      ⌨️ TYPE PALLET ID

    </button>

  </div>


  <!-- =====================================
       PALLET CAMERA
       ===================================== -->

  <div
    id="palletCameraScreen"
    class="hidden">

    <div id="reader"></div>


    <button
      class="close-camera-button"
      onclick="stopPalletScanner()">

      ✖ CLOSE CAMERA

    </button>

  </div>


  <!-- =====================================
       TYPE PALLET
       ===================================== -->

  <div
    id="typeScreen"
    class="hidden">

    <h3>Enter Pallet ID</h3>


    <input
      id="palletInput"
      type="text"
      placeholder="Example: PAL-000001"
      autocomplete="off"
      autocapitalize="characters">


    <button
      class="check-button"
      onclick="submitTypedPallet()">

      🔍 CHECK PALLET

    </button>


    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =====================================
       CAPTURED PALLET
       ===================================== -->

  <div
    id="capturedScreen"
    class="hidden">

    <div class="result">

      <div class="success">
        ✅ PALLET ID CAPTURED
      </div>

      <br>

      <span class="label">
        Pallet ID:
      </span>

      <span id="capturedPalletId">
      </span>

    </div>


    <button
      class="check-button"
      onclick="checkPallet()">

      🔍 CHECK PALLET

    </button>


    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =====================================
       PALLET DETAILS
       ===================================== -->

  <div
    id="palletDetailsScreen"
    class="hidden">


    <div class="result">

      <div class="success">
        ✅ PALLET FOUND
      </div>


      <div
        id="palletDetails"
        class="details">
      </div>

    </div>


    <!-- LOCATION WILL BE ADDED
         AFTER PALLET STEP IS CONFIRMED -->

    <button
      class="scan-button"
      onclick="locationStepComingSoon()">

      📍 SCAN LOCATION QR

    </button>


    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =====================================
       MESSAGE
       ===================================== -->

  <div
    id="message"
    class="result">

    Select Scan or Type Pallet ID.

  </div>


</div>


<script>


/************************************************
 * CONFIGURATION
 ************************************************/


/*
 * CURRENT WORKING APPS SCRIPT WEB APP
 *
 * IMPORTANT:
 * Use /exec URL only.
 */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyCTjHaU-7Md7FWXv1NxcTnJvt934LZ0c9KbyHyxEB92LERxjWzf1XcUBeRAX7fhImX/exec";


/************************************************
 * VARIABLES
 ************************************************/

let palletScanner = null;

let selectedPalletId = "";

let palletData = null;


/************************************************
 * START PALLET CAMERA
 ************************************************/

function startPalletScanner() {

  hideAllScreens();


  document
    .getElementById("palletCameraScreen")
    .classList.remove("hidden");


  setMessage(
    "📷 Opening live camera...",
    "info"
  );


  palletScanner =
    new Html5Qrcode("reader");


  palletScanner.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    function(decodedText) {

      /*
       * QR FOUND
       */

      selectedPalletId =
        String(decodedText)
          .trim();


      /*
       * Stop camera
       */

      stopPalletScanner();


      /*
       * Show captured ID
       */

      showCapturedPallet();

    },

    function(errorMessage) {

      /*
       * Normal scanner feedback.
       *
       * Do nothing.
       */

    }

  ).catch(function(error) {

    setMessage(
      "❌ Camera error: " +
      String(error),
      "error"
    );

  });

}


/************************************************
 * STOP PALLET CAMERA
 ************************************************/

function stopPalletScanner() {

  if (!palletScanner) {

    document
      .getElementById("palletCameraScreen")
      .classList.add("hidden");

    return;

  }


  palletScanner
    .stop()

    .then(function() {

      try {

        palletScanner.clear();

      }

      catch (e) {}

      palletScanner = null;

    })

    .catch(function() {

      palletScanner = null;

    });


  document
    .getElementById("palletCameraScreen")
    .classList.add("hidden");

}


/************************************************
 * OPEN TYPE SCREEN
 ************************************************/

function openTypeScreen() {

  stopPalletScanner();

  hideAllScreens();


  document
    .getElementById("typeScreen")
    .classList.remove("hidden");


  const input =
    document.getElementById(
      "palletInput"
    );


  input.value = "";


  setMessage(
    "Enter Pallet ID.",
    "info"
  );


  setTimeout(function() {

    input.focus();

  }, 200);

}


/************************************************
 * SUBMIT TYPED PALLET
 ************************************************/

function submitTypedPallet() {

  const input =
    document.getElementById(
      "palletInput"
    );


  let value =
    input.value.trim();


  if (!value) {

    setMessage(
      "❌ Please enter Pallet ID.",
      "error"
    );

    return;

  }


  /*
   * Convert to uppercase
   */

  value =
    value.toUpperCase();


  selectedPalletId =
    value;


  showCapturedPallet();

}


/************************************************
 * SHOW CAPTURED PALLET
 ************************************************/

function showCapturedPallet() {

  hideAllScreens();


  document
    .getElementById("capturedScreen")
    .classList.remove("hidden");


  document
    .getElementById("capturedPalletId")
    .innerText =
      selectedPalletId;


  setMessage(
    "Pallet ID captured successfully.",
    "info"
  );

}


/************************************************
 * CHECK PALLET
 ************************************************/

function checkPallet() {

  if (!selectedPalletId) {

    setMessage(
      "❌ Pallet ID is empty.",
      "error"
    );

    return;

  }


  /*
   * Show checking message
   */

  hideAllScreens();


  setMessage(
    "🔍 Checking pallet " +
    escapeHtml(selectedPalletId) +
    "...",
    "info"
  );


  /*
   * Unique JSONP callback
   */

  const callbackName =
    "abcPalletCallback_" +
    Date.now();


  /*
   * Create callback function
   */

  window[callbackName] =
    function(data) {

      console.log(
        "ABC Fruits API response:",
        data
      );


      /*
       * SUCCESS
       */

      if (
        data &&
        data.ok === true
      ) {

        palletData =
          data;


        showPalletDetails(
          data
        );


        cleanup();

        return;

      }


      /*
       * PALLET NOT FOUND
       */

      setMessage(

        "❌ " +
        (
          data &&
          data.message
            ? data.message
            : "Pallet not found."
        ),

        "error"

      );


      showCapturedPallet();


      cleanup();

    };


  /*
   * =========================================
   * IMPORTANT API URL
   *
   * Apps Script endpoint:
   *
   * /exec/pallet/PAL-000001
   *
   * JSONP:
   *
   * ?prefix=callback
   * =========================================
   */

  const requestUrl =
    API_URL +
    "/pallet/" +
    encodeURIComponent(
      selectedPalletId
    ) +
    "?prefix=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "ABC Fruits request:",
    requestUrl
  );


  /*
   * Create script element.
   *
   * JSONP works through a script
   * request instead of fetch().
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    requestUrl;


  script.async = true;


  /*
   * Request error
   */

  script.onerror =
    function() {

      setMessage(
        "❌ Apps Script request failed.",
        "error"
      );


      showCapturedPallet();


      cleanup();

    };


  /*
   * Add script to page
   */

  document
    .body
    .appendChild(
      script
    );


  /*
   * Timeout protection
   */

  setTimeout(
    function() {

      const existing =
        document.getElementById(
          callbackName
        );


      if (existing) {

        setMessage(
          "❌ Apps Script did not respond.",
          "error"
        );


        showCapturedPallet();


        cleanup();

      }

    },
    15000
  );


  /*
   * Cleanup function
   */

  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SHOW PALLET DETAILS
 ************************************************/

function showPalletDetails(
  data
) {

  hideAllScreens();


  document
    .getElementById(
      "palletDetailsScreen"
    )
    .classList.remove(
      "hidden"
    );


  const details =
    document.getElementById(
      "palletDetails"
    );


  details.innerHTML =

    "<b>Pallet ID:</b> " +
    safe(data.palletId) +

    "<br>" +

    "<b>Batch ID:</b> " +
    safe(data.batchId) +

    "<br>" +

    "<b>Product:</b> " +
    safe(data.product) +

    "<br>" +

    "<b>Production Date:</b> " +
    safe(data.productionDate) +

    "<br>" +

    "<b>Box Weight:</b> " +
    safe(data.boxWeightKG) +
    " KG" +

    "<br>" +

    "<b>Original Boxes:</b> " +
    safe(data.originalBoxes) +

    "<br>" +

    "<b>Current Boxes:</b> " +
    safe(data.currentBoxes) +

    "<br>" +

    "<b>Current KG:</b> " +
    safe(data.currentKG) +
    " KG" +

    "<br>" +

    "<b>Current Room:</b> " +
    safe(
      data.currentRoom ||
      "-"
    ) +

    "<br>" +

    "<b>Current Location:</b> " +
    safe(
      data.currentLocation ||
      "-"
    ) +

    "<br>" +

    "<b>Status:</b> " +
    safe(data.status);


  setMessage(
    "✅ Pallet information loaded from Google Sheet.",
    "success"
  );

}


/************************************************
 * LOCATION PLACEHOLDER
 ************************************************/

function locationStepComingSoon() {

  setMessage(
    "📍 Pallet verified. Location QR scanning will be added next.",
    "info"
  );

}


/************************************************
 * GO HOME
 ************************************************/

function goHome() {

  stopPalletScanner();


  selectedPalletId = "";

  palletData = null;


  hideAllScreens();


  document
    .getElementById(
      "methodScreen"
    )
    .classList.remove(
      "hidden"
    );


  setMessage(
    "Select Scan or Type Pallet ID.",
    "info"
  );

}


/************************************************
 * HIDE ALL SCREENS
 ************************************************/

function hideAllScreens() {

  document
    .getElementById(
      "methodScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "palletCameraScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "typeScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "capturedScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "palletDetailsScreen"
    )
    .classList.add(
      "hidden"
    );

}


/************************************************
 * MESSAGE
 ************************************************/

function setMessage(
  message,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML =
    message;


  box.className =
    "result";


  if (
    type === "error"
  ) {

    box.classList.add(
      "error"
    );

  }

  else if (
    type === "success"
  ) {

    box.classList.add(
      "success"
    );

  }

  else {

    box.classList.add(
      "info"
    );

  }

}


/************************************************
 * SAFE HTML
 ************************************************/

function safe(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
