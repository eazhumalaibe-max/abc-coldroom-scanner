<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>ABC Fruits - Cold Room</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 540px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 30px;
    }

    h2 {
      text-align: center;
      margin: 8px 0 22px;
      font-size: 24px;
    }

    h3 {
      text-align: center;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .scan-button {
      background: #111827;
      color: white;
    }

    .type-button {
      background: #2563eb;
      color: white;
    }

    .location-button {
      background: #7c3aed;
      color: white;
    }

    .back-button {
      background: #6b7280;
      color: white;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    #reader,
    #locationReader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 12px;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #f1f5f9;
      line-height: 1.7;
      font-size: 16px;
    }

    .success {
      color: #047857;
      font-weight: bold;
    }

    .error {
      color: #b91c1c;
      font-weight: bold;
    }

    .info {
      color: #1d4ed8;
      font-weight: bold;
    }

    .details {
      margin-top: 12px;
      line-height: 2;
    }

    .hidden {
      display: none !important;
    }

    .label {
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="card">

  <!-- =========================================
       HEADER
       ========================================= -->

  <h1>🍎 ABC Fruits</h1>

  <h2>❄️ Cold Room</h2>


  <!-- =========================================
       HOME
       ========================================= -->

  <div id="homeScreen">

    <h3>Pallet Verification</h3>

    <button
      class="scan-button"
      onclick="startPalletScanner()">

      📷 SCAN PALLET QR

    </button>


    <button
      class="type-button"
      onclick="openTypeScreen()">

      ⌨️ TYPE PALLET ID

    </button>

  </div>


  <!-- =========================================
       PALLET CAMERA
       ========================================= -->

  <div
    id="palletCameraScreen"
    class="hidden">

    <h3>📷 Scan Pallet QR</h3>

    <div id="reader"></div>

    <button
      class="back-button"
      onclick="stopPalletScanner()">

      ✖ CLOSE CAMERA

    </button>

  </div>


  <!-- =========================================
       TYPE PALLET
       ========================================= -->

  <div
    id="typeScreen"
    class="hidden">

    <h3>Enter Pallet ID</h3>

    <input
      id="palletInput"
      type="text"
      placeholder="PAL-000001"
      autocomplete="off"
      autocapitalize="characters">

    <button
      class="scan-button"
      onclick="verifyTypedPallet()">

      🔍 VERIFY PALLET

    </button>

    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =========================================
       VERIFYING
       ========================================= -->

  <div
    id="checkingScreen"
    class="hidden">

    <div class="result">

      <div class="info">
        🔍 CHECKING PALLET ID...
      </div>

      <br>

      <div>
        <b>Pallet ID:</b>
        <span id="checkingPalletId"></span>
      </div>

    </div>

  </div>


  <!-- =========================================
       PALLET VERIFIED
       ========================================= -->

  <div
    id="verifiedScreen"
    class="hidden">

    <div class="result">

      <div class="success">
        ✅ PALLET ID VERIFIED SUCCESSFULLY
      </div>

      <br>

      <div>
        <b>Pallet ID:</b>
        <span id="verifiedPalletId"></span>
      </div>

      <div
        id="palletDetails"
        class="details">
      </div>

    </div>


    <button
      class="location-button"
      onclick="startLocationScanner()">

      📍 SCAN LOCATION QR

    </button>


    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =========================================
       LOCATION CAMERA
       ========================================= -->

  <div
    id="locationCameraScreen"
    class="hidden">

    <h3>📍 Scan Location QR</h3>

    <div id="locationReader"></div>

    <button
      class="back-button"
      onclick="stopLocationScanner()">

      ✖ CLOSE CAMERA

    </button>

  </div>


  <!-- =========================================
       LOCATION SUCCESS
       ========================================= -->

  <div
    id="locationSuccessScreen"
    class="hidden">

    <div class="result">

      <div class="success">
        ✅ LOCATION UPDATED SUCCESSFULLY
      </div>

      <div
        id="locationDetails"
        class="details">
      </div>

    </div>


    <button
      class="scan-button"
      onclick="goHome()">

      ✔ DONE

    </button>

  </div>


  <!-- =========================================
       ERROR / MESSAGE
       ========================================= -->

  <div
    id="message"
    class="result">

    Ready to scan Pallet QR.

  </div>

</div>


<script>


/************************************************
 * ABC FRUITS CONFIGURATION
 ************************************************/


/*
 * YOUR CURRENT WORKING /exec URL
 *
 * If you deploy Code.gs again and receive
 * a NEW /exec URL, replace this URL.
 */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwdsmCQzonGG9mVq_JmU0jOOHKnY2lbxxMOdWWie_J34s_2g3LMNjUKE_w3KOUUN7jD/exec";


/************************************************
 * VARIABLES
 ************************************************/

let palletScanner = null;

let locationScanner = null;

let selectedPalletId = "";

let palletData = null;


/************************************************
 * START PALLET SCANNER
 ************************************************/

function startPalletScanner() {

  hideAllScreens();


  document
    .getElementById(
      "palletCameraScreen"
    )
    .classList.remove(
      "hidden"
    );


  setMessage(
    "📷 Opening live camera...",
    "info"
  );


  palletScanner =
    new Html5Qrcode(
      "reader"
    );


  palletScanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      /*
       * QR contains ONLY:
       *
       * PAL-000001
       */

      selectedPalletId =
        String(decodedText)
          .trim()
          .toUpperCase();


      /*
       * Stop camera
       */

      stopPalletScanner();


      /*
       * Automatically verify.
       *
       * NO CHECK BUTTON.
       */

      verifyPallet();

    },

    function(errorMessage) {

      /*
       * Ignore normal scanner messages.
       */

    }

  )

  .catch(function(error) {

    setMessage(
      "❌ Camera error: " +
      String(error),
      "error"
    );

  });

}


/************************************************
 * STOP PALLET SCANNER
 ************************************************/

function stopPalletScanner() {

  if (!palletScanner) {

    document
      .getElementById(
        "palletCameraScreen"
      )
      .classList.add(
        "hidden"
      );

    return;

  }


  palletScanner
    .stop()

    .then(function() {

      try {

        palletScanner.clear();

      }

      catch (e) {}

      palletScanner = null;

    })

    .catch(function() {

      palletScanner = null;

    });


  document
    .getElementById(
      "palletCameraScreen"
    )
    .classList.add(
      "hidden"
    );

}


/************************************************
 * OPEN TYPE SCREEN
 ************************************************/

function openTypeScreen() {

  hideAllScreens();


  document
    .getElementById(
      "typeScreen"
    )
    .classList.remove(
      "hidden"
    );


  const input =
    document.getElementById(
      "palletInput"
    );


  input.value = "";


  setMessage(
    "Enter Pallet ID.",
    "info"
  );


  setTimeout(function() {

    input.focus();

  }, 200);

}


/************************************************
 * VERIFY TYPED PALLET
 ************************************************/

function verifyTypedPallet() {

  const input =
    document.getElementById(
      "palletInput"
    );


  const value =
    input.value
      .trim()
      .toUpperCase();


  if (!value) {

    setMessage(
      "❌ Please enter Pallet ID.",
      "error"
    );

    return;

  }


  selectedPalletId =
    value;


  verifyPallet();

}


/************************************************
 * VERIFY PALLET
 ************************************************/

function verifyPallet() {

  if (!selectedPalletId) {

    setMessage(
      "❌ Pallet ID is empty.",
      "error"
    );

    return;

  }


  hideAllScreens();


  document
    .getElementById(
      "checkingScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "checkingPalletId"
    )
    .innerText =
      selectedPalletId;


  setMessage(
    "🔍 Checking Pallet ID...",
    "info"
  );


  /*
   * Unique JSONP callback.
   */

  const callbackName =
    "abcPallet_" +
    Date.now();


  let finished = false;


  /*
   * JSONP CALLBACK
   */

  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }


      finished = true;


      console.log(
        "ABC Fruits Pallet API Response:",
        data
      );


      /*
       * SUCCESS
       */

      if (
        data &&
        data.ok === true
      ) {

        palletData =
          data;


        showVerifiedScreen();


        cleanup();


        return;

      }


      /*
       * PALLET NOT FOUND
       */

      setMessage(
        "❌ " +
        (
          data &&
          data.message
            ? data.message
            : "Pallet not found."
        ),
        "error"
      );


      showHome();


      cleanup();

    };


  /*
   * API URL:
   *
   * /pallet/PAL-000001
   *
   * JSONP:
   *
   * ?prefix=callback
   */

  const requestUrl =
    API_URL +
    "/pallet/" +
    encodeURIComponent(
      selectedPalletId
    ) +
    "?prefix=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "Pallet Request URL:",
    requestUrl
  );


  /*
   * JSONP script element.
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    requestUrl;


  script.async = true;


  /*
   * Request failed.
   */

  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;


      setMessage(
        "❌ Pallet API request failed.",
        "error"
      );


      showHome();


      cleanup();

    };


  /*
   * Send request.
   */

  document
    .body
    .appendChild(
      script
    );


  /*
   * 15-second timeout.
   */

  setTimeout(function() {

    if (finished) {
      return;
    }


    const existing =
      document.getElementById(
        callbackName
      );


    if (existing) {

      finished = true;


      setMessage(
        "❌ Pallet API timeout.",
        "error"
      );


      showHome();


      cleanup();

    }

  }, 15000);


  /*
   * Cleanup.
   */

  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SHOW VERIFIED SCREEN
 ************************************************/

function showVerifiedScreen() {

  hideAllScreens();


  document
    .getElementById(
      "verifiedScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "verifiedPalletId"
    )
    .innerText =
      palletData.palletId;


  document
    .getElementById(
      "palletDetails"
    )
    .innerHTML =

      "<b>Batch ID:</b> " +
      safe(
        palletData.batchId
      ) +

      "<br>" +

      "<b>Product:</b> " +
      safe(
        palletData.product
      ) +

      "<br>" +

      "<b>Production Date:</b> " +
      safe(
        palletData.productionDate
      ) +

      "<br>" +

      "<b>Box Weight:</b> " +
      safe(
        palletData.boxWeightKG
      ) +
      " KG" +

      "<br>" +

      "<b>Original Boxes:</b> " +
      safe(
        palletData.originalBoxes
      ) +

      "<br>" +

      "<b>Current Boxes:</b> " +
      safe(
        palletData.currentBoxes
      ) +

      "<br>" +

      "<b>Current KG:</b> " +
      safe(
        palletData.currentKG
      ) +
      " KG" +

      "<br>" +

      "<b>Current Room:</b> " +
      safe(
        palletData.currentRoom ||
        "-"
      ) +

      "<br>" +

      "<b>Current Location:</b> " +
      safe(
        palletData.currentLocation ||
        "-"
      ) +

      "<br>" +

      "<b>Status:</b> " +
      safe(
        palletData.status
      );


  setMessage(
    "✅ Pallet ID verified successfully.",
    "success"
  );

}


/************************************************
 * START LOCATION SCANNER
 ************************************************/

function startLocationScanner() {

  hideAllScreens();


  document
    .getElementById(
      "locationCameraScreen"
    )
    .classList.remove(
      "hidden"
    );


  setMessage(
    "📍 Scan Location QR...",
    "info"
  );


  locationScanner =
    new Html5Qrcode(
      "locationReader"
    );


  locationScanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      /*
       * Example Location QR:
       *
       * CR01-A01-01
       */

      const locationId =
        String(decodedText)
          .trim()
          .toUpperCase();


      stopLocationScanner();


      updatePalletLocation(
        locationId
      );

    },

    function(errorMessage) {

      /*
       * Ignore normal scanner messages.
       */

    }

  )

  .catch(function(error) {

    setMessage(
      "❌ Location camera error: " +
      String(error),
      "error"
    );

  });

}


/************************************************
 * STOP LOCATION SCANNER
 ************************************************/

function stopLocationScanner() {

  if (!locationScanner) {

    document
      .getElementById(
        "locationCameraScreen"
      )
      .classList.add(
        "hidden"
      );

    return;

  }


  locationScanner
    .stop()

    .then(function() {

      try {

        locationScanner.clear();

      }

      catch (e) {}

      locationScanner = null;

    })

    .catch(function() {

      locationScanner = null;

    });


  document
    .getElementById(
      "locationCameraScreen"
    )
    .classList.add(
      "hidden"
    );

}


/************************************************
 * UPDATE LOCATION
 ************************************************/

function updatePalletLocation(
  locationId
) {

  if (!selectedPalletId) {

    setMessage(
      "❌ Pallet ID missing.",
      "error"
    );

    return;

  }


  if (!locationId) {

    setMessage(
      "❌ Location QR is empty.",
      "error"
    );

    return;

  }


  hideAllScreens();


  setMessage(
    "💾 Saving location...",
    "info"
  );


  /*
   * Unique JSONP callback.
   */

  const callbackName =
    "abcLocation_" +
    Date.now();


  let finished = false;


  /*
   * JSONP callback.
   */

  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }


      finished = true;


      console.log(
        "ABC Fruits Location API:",
        data
      );


      /*
       * SUCCESS
       */

      if (
        data &&
        data.ok === true
      ) {

        showLocationSuccess(
          data
        );


        cleanup();


        return;

      }


      /*
       * ERROR
       */

      setMessage(
        "❌ " +
        (
          data &&
          data.message
            ? data.message
            : "Location update failed."
        ),
        "error"
      );


      showVerifiedScreen();


      cleanup();

    };


  /*
   * Request:
   *
   * /setPallet/PAL-000001/location/CR01-A01-01
   */

  const requestUrl =
    API_URL +
    "/setPallet/" +
    encodeURIComponent(
      selectedPalletId
    ) +
    "/location/" +
    encodeURIComponent(
      locationId
    ) +
    "?prefix=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "Location Request URL:",
    requestUrl
  );


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    requestUrl;


  script.async = true;


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;


      setMessage(
        "❌ Location API request failed.",
        "error"
      );


      showVerifiedScreen();


      cleanup();

    };


  document
    .body
    .appendChild(
      script
    );


  /*
   * Timeout.
   */

  setTimeout(function() {

    if (finished) {
      return;
    }


    const existing =
      document.getElementById(
        callbackName
      );


    if (existing) {

      finished = true;


      setMessage(
        "❌ Location API timeout.",
        "error"
      );


      showVerifiedScreen();


      cleanup();

    }

  }, 15000);


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * LOCATION SUCCESS
 ************************************************/

function showLocationSuccess(
  data
) {

  hideAllScreens();


  document
    .getElementById(
      "locationSuccessScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "locationDetails"
    )
    .innerHTML =

      "<b>Pallet ID:</b> " +
      safe(
        data.palletId
      ) +

      "<br>" +

      "<b>Location QR:</b> " +
      safe(
        data.locationId
      ) +

      "<br>" +

      "<b>Current Room:</b> " +
      safe(
        data.currentRoom
      ) +

      "<br>" +

      "<b>Current Location:</b> " +
      safe(
        data.currentLocation
      );


  setMessage(
    "✅ Location updated successfully.",
    "success"
  );

}


/************************************************
 * HOME
 ************************************************/

function goHome() {

  stopPalletScanner();

  stopLocationScanner();


  selectedPalletId = "";

  palletData = null;


  showHome();


  setMessage(
    "Ready to scan Pallet QR.",
    "info"
  );

}


/************************************************
 * SHOW HOME
 ************************************************/

function showHome() {

  hideAllScreens();


  document
    .getElementById(
      "homeScreen"
    )
    .classList.remove(
      "hidden"
    );

}


/************************************************
 * HIDE ALL SCREENS
 ************************************************/

function hideAllScreens() {

  document
    .getElementById(
      "homeScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "palletCameraScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "typeScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "checkingScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "verifiedScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "locationCameraScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "locationSuccessScreen"
    )
    .classList.add(
      "hidden"
    );

}


/************************************************
 * MESSAGE
 ************************************************/

function setMessage(
  message,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML =
    message;


  box.className =
    "result";


  if (
    type === "success"
  ) {

    box.classList.add(
      "success"
    );

  }

  else if (
    type === "error"
  ) {

    box.classList.add(
      "error"
    );

  }

  else {

    box.classList.add(
      "info"
    );

  }

}


/************************************************
 * SAFE HTML
 ************************************************/

function safe(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
