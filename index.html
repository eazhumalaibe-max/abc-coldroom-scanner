<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ABC Fruits Cold Room</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  margin: 0;
  padding: 15px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 2px 12px #0002;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  text-align: center;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
}

.scanButton {
  background: #111827;
  color: white;
}

.typeButton {
  background: #2563eb;
  color: white;
}

.checkButton {
  background: #059669;
  color: white;
}

.closeButton {
  background: #6b7280;
  color: white;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 18px;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

.result {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: #f1f5f9;
  line-height: 1.7;
}

.success {
  color: #047857;
  font-weight: bold;
}

.error {
  color: #b91c1c;
  font-weight: bold;
}

.info {
  color: #1d4ed8;
  font-weight: bold;
}

.hidden {
  display: none;
}

.palletDetails {
  margin-top: 15px;
  line-height: 2;
}

</style>

</head>

<body>

<div class="card">

<h1>🍎 ABC Fruits</h1>

<h2>❄️ Cold Room</h2>


<!-- =========================================
     METHOD SCREEN
     ========================================= -->

<div id="methodScreen">

  <h3>Select Pallet Entry Method</h3>

  <button
    class="scanButton"
    onclick="startScanner()">

    📷 SCAN PALLET QR

  </button>


  <button
    class="typeButton"
    onclick="showTypeScreen()">

    ⌨️ TYPE PALLET ID

  </button>

</div>


<!-- =========================================
     CAMERA
     ========================================= -->

<div
  id="scannerScreen"
  class="hidden">

  <div id="reader"></div>

  <button
    class="closeButton"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>

</div>


<!-- =========================================
     TYPE SCREEN
     ========================================= -->

<div
  id="typeScreen"
  class="hidden">

  <h3>Enter Pallet ID</h3>

  <input
    id="palletInput"
    type="text"
    placeholder="Example: PAL-000001"
    autocomplete="off"
    autocapitalize="characters">


  <button
    class="checkButton"
    onclick="submitTypedPallet()">

    CHECK PALLET

  </button>


  <button
    class="closeButton"
    onclick="backToMethod()">

    ← BACK

  </button>

</div>


<!-- =========================================
     PALLET CAPTURED
     ========================================= -->

<div
  id="capturedScreen"
  class="hidden">

  <div class="result">

    <div class="success">
      ✅ PALLET ID CAPTURED
    </div>

    <br>

    <b>Pallet ID:</b>

    <span id="capturedPallet"></span>

  </div>


  <button
    class="checkButton"
    onclick="loadPallet()">

    🔍 CHECK PALLET

  </button>


  <button
    class="closeButton"
    onclick="backToMethod()">

    ← BACK

  </button>

</div>


<!-- =========================================
     PALLET DETAILS
     ========================================= -->

<div
  id="palletScreen"
  class="hidden">

  <div class="result">

    <div class="success">
      ✅ PALLET FOUND
    </div>


    <div
      id="palletDetails"
      class="palletDetails">
    </div>

  </div>


  <button
    class="scanButton"
    onclick="nextLocationStep()">

    📍 SCAN LOCATION QR

  </button>


  <button
    class="closeButton"
    onclick="backToMethod()">

    ← BACK

  </button>

</div>


<!-- =========================================
     MESSAGE
     ========================================= -->

<div
  id="message"
  class="result">

  Select Scan or Type Pallet ID.

</div>


</div>


<script>

/************************************************
 * CONFIGURATION
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbyCTjHaU-7Md7FWXv1NxcTnJvt934LZ0c9KbyHyxEB92LERxjWzf1XcUBeRAX7fhImX/exec";


/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let selectedPalletId = "";

let palletData = null;


/************************************************
 * START CAMERA
 ************************************************/

function startScanner() {

  hideAllScreens();

  document
    .getElementById("scannerScreen")
    .classList.remove("hidden");


  setMessage(
    "📷 Opening live camera...",
    "info"
  );


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      selectedPalletId =
        String(decodedText)
        .trim();


      stopScanner();

      showCapturedPallet();

    },

    function(errorMessage) {

      // Ignore normal scanning messages

    }

  ).catch(function(error) {

    setMessage(
      "❌ Camera error: " + error,
      "error"
    );

  });

}


/************************************************
 * STOP CAMERA
 ************************************************/

function stopScanner() {

  if (!scanner) {

    document
      .getElementById("scannerScreen")
      .classList.add("hidden");

    return;

  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });


  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

}


/************************************************
 * TYPE SCREEN
 ************************************************/

function showTypeScreen() {

  hideAllScreens();

  document
    .getElementById("typeScreen")
    .classList.remove("hidden");


  document
    .getElementById("palletInput")
    .value = "";


  document
    .getElementById("palletInput")
    .focus();

}


/************************************************
 * TYPED PALLET
 ************************************************/

function submitTypedPallet() {

  const value =
    document
      .getElementById("palletInput")
      .value
      .trim();


  if (!value) {

    setMessage(
      "❌ Please enter Pallet ID.",
      "error"
    );

    return;

  }


  selectedPalletId =
    value.toUpperCase();


  showCapturedPallet();

}


/************************************************
 * SHOW CAPTURED PALLET
 ************************************************/

function showCapturedPallet() {

  hideAllScreens();

  document
    .getElementById("capturedScreen")
    .classList.remove("hidden");


  document
    .getElementById("capturedPallet")
    .innerText =
      selectedPalletId;


  setMessage(
    "Pallet ID captured successfully.",
    "info"
  );

}


/************************************************
 * LOAD PALLET FROM GOOGLE SHEET
 ************************************************/

function loadPallet() {

  if (!selectedPalletId) {

    setMessage(
      "❌ Pallet ID is empty.",
      "error"
    );

    return;

  }


  hideAllScreens();


  setMessage(
    "🔍 Checking pallet " +
    selectedPalletId +
    "...",
    "info"
  );


  /*
   * JSONP callback
   */

  const callbackName =
    "abcPallet_" +
    Date.now();


  /*
   * Create callback
   */

  window[callbackName] =
    function(data) {

      console.log(
        "ABC Fruits API:",
        data
      );


      if (
        data &&
        data.ok === true
      ) {

        palletData = data;

        showPalletDetails(data);

      }

      else {

        setMessage(
          "❌ " +
          (
            data &&
            data.message
              ? data.message
              : "Pallet not found."
          ),
          "error"
        );


        showCapturedScreen();

      }


      cleanup();

    };


  /*
   * Build API URL
   *
   * IMPORTANT:
   * pallet is in PATH
   */

  const requestUrl =
    API_URL +
    "/pallet/" +
    encodeURIComponent(
      selectedPalletId
    ) +
    "?prefix=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "Request URL:",
    requestUrl
  );


  /*
   * JSONP script
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    requestUrl;


  script.onerror =
    function() {

      setMessage(
        "❌ Apps Script request failed.",
        "error"
      );


      showCapturedScreen();

      cleanup();

    };


  document
    .body
    .appendChild(script);


  /*
   * Timeout
   */

  setTimeout(function() {

    if (
      document.getElementById(
        callbackName
      )
    ) {

      setMessage(
        "❌ No response from Apps Script.",
        "error"
      );


      showCapturedScreen();

      cleanup();

    }

  }, 15000);


  /*
   * Cleanup
   */

  function cleanup() {

    try {

      delete window[callbackName];

    }

    catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SHOW PALLET DETAILS
 ************************************************/

function showPalletDetails(data) {

  hideAllScreens();


  document
    .getElementById("palletScreen")
    .classList.remove("hidden");


  document
    .getElementById("palletDetails")
    .innerHTML =

      "<b>Pallet ID:</b> " +
      safe(data.palletId) +

      "<br>" +

      "<b>Batch ID:</b> " +
      safe(data.batchId) +

      "<br>" +

      "<b>Product:</b> " +
      safe(data.product) +

      "<br>" +

      "<b>Production Date:</b> " +
      safe(data.productionDate) +

      "<br>" +

      "<b>Box Weight:</b> " +
      safe(data.boxWeightKG) +
      " KG" +

      "<br>" +

      "<b>Original Boxes:</b> " +
      safe(data.originalBoxes) +

      "<br>" +

      "<b>Current Boxes:</b> " +
      safe(data.currentBoxes) +

      "<br>" +

      "<b>Current KG:</b> " +
      safe(data.currentKG) +
      " KG" +

      "<br>" +

      "<b>Current Room:</b> " +
      safe(data.currentRoom || "-") +

      "<br>" +

      "<b>Current Location:</b> " +
      safe(data.currentLocation || "-") +

      "<br>" +

      "<b>Status:</b> " +
      safe(data.status);


  setMessage(
    "✅ Pallet information loaded from Google Sheet.",
    "success"
  );

}


/************************************************
 * NEXT LOCATION STEP
 ************************************************/

function nextLocationStep() {

  setMessage(
    "📍 Pallet verified. Location QR scanning will be added next.",
    "info"
  );

}


/************************************************
 * SHOW CAPTURED SCREEN
 ************************************************/

function showCapturedScreen() {

  hideAllScreens();

  document
    .getElementById("capturedScreen")
    .classList.remove("hidden");

}


/************************************************
 * BACK
 ************************************************/

function backToMethod() {

  stopScanner();

  selectedPalletId = "";

  palletData = null;

  hideAllScreens();


  document
    .getElementById("methodScreen")
    .classList.remove("hidden");


  setMessage(
    "Select Scan or Type Pallet ID.",
    "info"
  );

}


/************************************************
 * HIDE ALL
 ************************************************/

function hideAllScreens() {

  document
    .getElementById("methodScreen")
    .classList.add("hidden");

  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("capturedScreen")
    .classList.add("hidden");

  document
    .getElementById("palletScreen")
    .classList.add("hidden");

}


/************************************************
 * MESSAGE
 ************************************************/

function setMessage(
  message,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML =
    message;


  box.className =
    "result";


  if (type === "error") {

    box.classList.add(
      "error"
    );

  }

  else if (
    type === "success"
  ) {

    box.classList.add(
      "success"
    );

  }

  else {

    box.classList.add(
      "info"
    );

  }

}


/************************************************
 * SAFE HTML
 ************************************************/

function safe(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
