<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ABC Fruits Cold Room Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  margin: 0;
  padding: 15px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 2px 12px #0002;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  text-align: center;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
}

.scanButton {
  background: #111827;
  color: white;
}

.typeButton {
  background: #2563eb;
  color: white;
}

.closeButton {
  background: #6b7280;
  color: white;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 18px;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

.result {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: #f1f5f9;
  line-height: 1.8;
}

.success {
  color: #047857;
  font-weight: bold;
}

.error {
  color: #b91c1c;
  font-weight: bold;
}

.info {
  color: #1d4ed8;
  font-weight: bold;
}

.hidden {
  display: none;
}

</style>

</head>

<body>

<div class="card">

<h1>🍎 ABC Fruits</h1>

<h2>❄️ Cold Room Scanner</h2>


<!-- MAIN -->

<div id="mainScreen">

  <h3>Select Pallet Entry</h3>

  <button
    class="scanButton"
    onclick="startScanner()">

    📷 SCAN PALLET QR

  </button>

  <button
    class="typeButton"
    onclick="showTypeScreen()">

    ⌨️ TYPE PALLET ID

  </button>

</div>


<!-- CAMERA -->

<div
  id="scannerScreen"
  class="hidden">

  <div id="reader"></div>

  <button
    class="closeButton"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>

</div>


<!-- TYPE -->

<div
  id="typeScreen"
  class="hidden">

  <h3>Enter Pallet ID</h3>

  <input
    id="palletInput"
    type="text"
    placeholder="PAL-000001"
    autocomplete="off">

  <button
    class="typeButton"
    onclick="submitTypedPallet()">

    🔍 CHECK PALLET

  </button>

  <button
    class="closeButton"
    onclick="backHome()">

    ← BACK

  </button>

</div>


<!-- RESULT -->

<div
  id="resultScreen"
  class="hidden">

  <div
    id="result"
    class="result">
  </div>

  <button
    class="typeButton"
    onclick="backHome()">

    ← SCAN ANOTHER PALLET

  </button>

</div>


<!-- MESSAGE -->

<div
  id="message"
  class="result">

  Ready.

</div>

</div>


<script>


/************************************************
 * APPS SCRIPT API
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbxMKcJocdPur7V9D2SUd3TQGElzHIcuuzOhNHjKAnedSjuRimGwgZ4z8MOJftSi8t7G/exec";


let scanner = null;

let currentPallet = "";


/************************************************
 * START CAMERA
 ************************************************/

function startScanner() {

  document
    .getElementById("mainScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

  document
    .getElementById("scannerScreen")
    .classList.remove("hidden");


  document
    .getElementById("message")
    .innerHTML =
      '<span class="info">' +
      '📷 Opening camera...' +
      '</span>';


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      currentPallet =
        String(decodedText)
        .trim()
        .toUpperCase();


      stopScanner();

      getPallet(
        currentPallet
      );

    },

    function(errorMessage) {

      // Normal scanner messages ignored

    }

  )

  .catch(function(error) {

    showError(
      "Camera error: " +
      error
    );

  });

}


/************************************************
 * STOP CAMERA
 ************************************************/

function stopScanner() {

  if (!scanner) {

    document
      .getElementById("scannerScreen")
      .classList.add("hidden");

    return;

  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });


  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

}


/************************************************
 * TYPE SCREEN
 ************************************************/

function showTypeScreen() {

  document
    .getElementById("mainScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.remove("hidden");


  document
    .getElementById("palletInput")
    .value = "";


  document
    .getElementById("palletInput")
    .focus();

}


/************************************************
 * TYPE PALLET
 ************************************************/

function submitTypedPallet() {

  const value =
    document
      .getElementById("palletInput")
      .value
      .trim()
      .toUpperCase();


  if (!value) {

    showError(
      "Please enter Pallet ID."
    );

    return;

  }


  currentPallet =
    value;


  getPallet(
    currentPallet
  );

}


/************************************************
 * GET PALLET FROM APPS SCRIPT
 ************************************************/

function getPallet(palletId) {

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  document
    .getElementById("result")
    .innerHTML =
      '<span class="info">' +
      '🔍 Checking pallet <b>' +
      escapeHtml(palletId) +
      '</b>...' +
      '</span>';


  document
    .getElementById("message")
    .innerHTML =
      "Connecting to Google Sheet...";


  /*
   * Unique callback
   */

  const callbackName =
    "abcPalletCallback_" +
    Date.now();


  /*
   * Create callback
   */

  window[callbackName] =
    function(data) {

      console.log(
        "Pallet API:",
        data
      );


      if (
        data &&
        data.ok === true
      ) {

        showPallet(
          data
        );

      }

      else {

        showError(
          data &&
          data.message
            ? data.message
            : "Pallet not found."
        );

      }


      cleanup();

    };


  /*
   * Build JSONP URL
   */

  const url =
    API_URL +
    "?action=getPallet" +
    "&palletId=" +
    encodeURIComponent(
      palletId
    ) +
    "&prefix=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  /*
   * Script request
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    url;


  script.async = true;


  script.onerror =
    function() {

      showError(
        "Apps Script request failed."
      );

      cleanup();

    };


  document
    .body
    .appendChild(
      script
    );


  /*
   * Cleanup
   */

  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SHOW PALLET
 ************************************************/

function showPallet(data) {

  document
    .getElementById("result")
    .innerHTML =

      '<div class="success">' +
      '✅ PALLET FOUND' +
      '</div>' +

      '<br>' +

      '<b>Pallet ID:</b> ' +
      safe(data.palletId) +

      '<br>' +

      '<b>Product:</b> ' +
      safe(data.product) +

      '<br>' +

      '<b>Batch:</b> ' +
      safe(data.batchId) +

      '<br>' +

      '<b>Box Weight:</b> ' +
      safe(data.boxWeight) +
      ' KG' +

      '<br>' +

      '<b>Original Boxes:</b> ' +
      safe(data.originalBoxes) +

      '<br>' +

      '<b>Current Boxes:</b> ' +
      safe(data.currentBoxes) +

      '<br>' +

      '<b>Current KG:</b> ' +
      safe(data.currentKG) +
      ' KG' +

      '<br>' +

      '<b>Cold Room:</b> ' +
      safe(data.currentRoom) +

      '<br>' +

      '<b>Location:</b> ' +
      safe(data.currentLocation) +

      '<br>' +

      '<b>Status:</b> ' +
      safe(data.status);


  document
    .getElementById("message")
    .innerHTML =
      '<span class="success">' +
      '✅ Google Sheet data loaded' +
      '</span>';

}


/************************************************
 * ERROR
 ************************************************/

function showError(message) {

  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  document
    .getElementById("result")
    .innerHTML =
      '<span class="error">' +
      '❌ ' +
      escapeHtml(message) +
      '</span>';

}


/************************************************
 * BACK HOME
 ************************************************/

function backHome() {

  stopScanner();


  document
    .getElementById("mainScreen")
    .classList.remove("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");


  document
    .getElementById("message")
    .innerHTML =
      "Ready.";

}


/************************************************
 * SAFE VALUE
 ************************************************/

function safe(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


/************************************************
 * ESCAPE HTML
 ************************************************/

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
