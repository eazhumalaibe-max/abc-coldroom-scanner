<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>
    ABC Fruits Cold Room Scanner
  </title>


  <!-- QR SCANNER -->

  <script
    src="https://unpkg.com/html5-qrcode">
  </script>


  <style>

    body {

      font-family:
        Arial,
        sans-serif;

      background:
        #f3f4f6;

      margin: 0;

      padding: 15px;
    }


    .card {

      max-width:
        520px;

      margin:
        auto;

      background:
        white;

      padding:
        20px;

      border-radius:
        18px;

      box-shadow:
        0 2px 12px #0002;
    }


    h1,
    h2 {

      text-align:
        center;
    }


    button {

      width:
        100%;

      padding:
        16px;

      margin:
        8px 0;

      border:
        none;

      border-radius:
        10px;

      font-size:
        17px;

      font-weight:
        bold;
    }


    .scan {

      background:
        #111827;

      color:
        white;
    }


    .close {

      background:
        #6b7280;

      color:
        white;
    }


    #reader {

      width:
        100%;

      margin-top:
        15px;
    }


    .result {

      margin-top:
        18px;

      padding:
        16px;

      border-radius:
        12px;

      background:
        #f1f5f9;

      line-height:
        1.8;

      font-size:
        16px;
    }


    .success {

      color:
        #047857;

      font-weight:
        bold;

      font-size:
        19px;
    }


    .error {

      color:
        #b91c1c;

      font-weight:
        bold;
    }


    .hidden {

      display:
        none;
    }


    iframe {

      display:
        none;
    }

  </style>

</head>


<body>


<div class="card">


  <h1>
    🍎 ABC Fruits
  </h1>


  <h2>
    ❄️ Cold Room Scanner
  </h2>


  <!--
    Apps Script bridge

    This does NOT open the camera.
    It only connects GitHub to Google Sheet.
  -->

  <iframe
    id="abcBridge"
    title="ABC Fruits Inventory Bridge"
    src="https://script.google.com/macros/s/AKfycbwcKf7tvHMhWAazmLMj7jUuKfxGnJ-NnJfIhOXL08dGDeGS1LNDXcJka6jTM11yBvzk/exec">
  </iframe>


  <button
    class="scan"
    onclick="startScanner()">

    📷 SCAN PALLET QR

  </button>


  <div
    id="reader">
  </div>


  <button
    id="closeButton"
    class="close hidden"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>


  <div
    id="result"
    class="result">

    Ready to scan pallet QR.

  </div>


</div>


<script>


/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let bridgeReady = false;


/************************************************
 * BRIDGE MESSAGE LISTENER
 ************************************************/

window.addEventListener(
  "message",
  function(event) {

    if (!event.data) {
      return;
    }


    /*
     * PALLET RESULT
     */

    if (
      event.data.type ===
      "ABC_PALLET_RESULT"
    ) {

      const result =
        event.data.result;


      if (
        result &&
        result.ok === true
      ) {

        showPallet(result);

      }

      else {

        showError(

          result &&
          result.message

            ? result.message

            : "Pallet not found."

        );

      }


      return;
    }


    /*
     * ERROR
     */

    if (
      event.data.type ===
      "ABC_PALLET_ERROR"
    ) {

      showError(

        "Google Sheet error: " +
        event.data.message

      );

    }

  }
);


/************************************************
 * START LIVE CAMERA
 ************************************************/

function startScanner() {

  document
    .getElementById("result")
    .innerHTML =
      "📷 Opening live camera...";


  document
    .getElementById("closeButton")
    .classList.remove(
      "hidden"
    );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      {

        fps:
          10,

        qrbox:
          {
            width:
              250,

            height:
              250
          }

      },


      function(decodedText) {

        /*
         * QR FOUND
         */

        stopScanner();


        checkPallet(
          decodedText
        );

      },


      function(errorMessage) {

        /*
         * Normal scanning
         * messages are ignored.
         */

      }

    )

    .catch(
      function(error) {

        showError(

          "Camera error: " +
          error

        );

      }
    );
}


/************************************************
 * STOP CAMERA
 ************************************************/

function stopScanner() {

  if (!scanner) {

    return;
  }


  scanner
    .stop()

    .then(
      function() {

        scanner.clear();

        scanner = null;

      }
    )

    .catch(
      function() {

        scanner = null;

      }
    );


  document
    .getElementById(
      "closeButton"
    )
    .classList.add(
      "hidden"
    );
}


/************************************************
 * SEND PALLET TO BRIDGE
 ************************************************/

function checkPallet(palletId) {

  palletId =
    String(
      palletId || ""
    ).trim();


  if (!palletId) {

    showError(
      "Pallet QR is empty."
    );

    return;
  }


  document
    .getElementById("result")
    .innerHTML =

      "🔍 Checking pallet <b>" +

      escapeHtml(
        palletId
      ) +

      "</b>...";


  const bridge =
    document
      .getElementById(
        "abcBridge"
      );


  if (
    !bridge ||
    !bridge.contentWindow
  ) {

    showError(
      "Inventory bridge is not available."
    );

    return;
  }


  bridge
    .contentWindow
    .postMessage(

      {

        type:
          "ABC_GET_PALLET",

        palletId:
          palletId

      },

      "*"

    );
}


/************************************************
 * SHOW PALLET
 ************************************************/

function showPallet(data) {

  document
    .getElementById("result")
    .innerHTML =

      '<div class="success">' +

      "✅ PALLET FOUND" +

      "</div><br>" +


      "<b>Pallet ID:</b> " +

      safe(
        data.palletId
      ) +

      "<br>" +


      "<b>Product:</b> " +

      safe(
        data.product
      ) +

      "<br>" +


      "<b>Batch:</b> " +

      safe(
        data.batchId
      ) +

      "<br>" +


      "<b>Box Weight:</b> " +

      safe(
        data.boxWeight
      ) +

      " KG<br>" +


      "<b>Original Boxes:</b> " +

      safe(
        data.originalBoxes
      ) +

      "<br>" +


      "<b>Current Boxes:</b> " +

      safe(
        data.currentBoxes
      ) +

      "<br>" +


      "<b>Current KG:</b> " +

      safe(
        data.currentKG
      ) +

      " KG<br>" +


      "<b>Cold Room:</b> " +

      safe(
        data.currentRoom
      ) +

      "<br>" +


      "<b>Location:</b> " +

      safe(
        data.currentLocation
      ) +

      "<br>" +


      "<b>Status:</b> " +

      safe(
        data.status
      );
}


/************************************************
 * SHOW ERROR
 ************************************************/

function showError(message) {

  document
    .getElementById("result")
    .innerHTML =

      '<span class="error">' +

      "❌ " +

      escapeHtml(
        message
      ) +

      "</span>";
}


/************************************************
 * SAFE TEXT
 ************************************************/

function safe(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";
  }


  return escapeHtml(
    String(value)
  );
}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


</script>


</body>

</html>
