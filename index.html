<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ABC Fruits Cold Room</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  margin: 0;
  padding: 15px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 2px 12px #0002;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  text-align: center;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
}

.scanButton {
  background: #111827;
  color: white;
}

.typeButton {
  background: #2563eb;
  color: white;
}

.checkButton {
  background: #059669;
  color: white;
}

.closeButton {
  background: #6b7280;
  color: white;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 18px;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

.result {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: #f1f5f9;
  line-height: 1.7;
}

.success {
  color: #047857;
  font-weight: bold;
}

.error {
  color: #b91c1c;
  font-weight: bold;
}

.hidden {
  display: none;
}

</style>

</head>

<body>

<div class="card">

<h1>🍎 ABC Fruits</h1>

<h2>❄️ Cold Room</h2>


<!-- =========================================
     STEP 1
     ========================================= -->

<div id="methodScreen">

  <h3>Select Pallet Entry Method</h3>

  <button
    class="scanButton"
    onclick="startScanner()">

    📷 SCAN PALLET QR

  </button>


  <button
    class="typeButton"
    onclick="showTypeScreen()">

    ⌨️ TYPE PALLET ID

  </button>

</div>


<!-- =========================================
     LIVE CAMERA
     ========================================= -->

<div
  id="scannerScreen"
  class="hidden">

  <div id="reader"></div>

  <button
    class="closeButton"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>

</div>


<!-- =========================================
     TYPE PALLET
     ========================================= -->

<div
  id="typeScreen"
  class="hidden">

  <h3>Enter Pallet ID</h3>

  <input
    id="palletInput"
    type="text"
    placeholder="Example: PAL-000001"
    autocomplete="off"
    autocapitalize="characters">

  <button
    class="checkButton"
    onclick="submitTypedPallet()">

    CHECK PALLET

  </button>

  <button
    class="closeButton"
    onclick="backToMethod()">

    ← BACK

  </button>

</div>


<!-- =========================================
     PALLET RESULT
     ========================================= -->

<div
  id="resultScreen"
  class="hidden">

  <div class="result">

    <div class="success">
      ✅ PALLET ID CAPTURED
    </div>

    <br>

    <b>Pallet ID:</b>

    <span id="capturedPallet">
    </span>

  </div>


  <button
    class="checkButton"
    onclick="checkPallet()">

    🔍 CHECK PALLET

  </button>


  <button
    class="closeButton"
    onclick="backToMethod()">

    ← BACK

  </button>

</div>


<!-- =========================================
     MESSAGE
     ========================================= -->

<div
  id="message"
  class="result">

  Select Scan or Type Pallet ID.

</div>


</div>


<script>

/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let selectedPalletId = "";


/************************************************
 * START LIVE CAMERA
 ************************************************/

function startScanner() {

  document
    .getElementById("methodScreen")
    .classList.add("hidden");

  document
    .getElementById("scannerScreen")
    .classList.remove("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");


  document
    .getElementById("message")
    .innerHTML =
      "📷 Opening live camera...";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      selectedPalletId =
        String(decodedText)
        .trim();

      stopScanner();

      showCapturedPallet();

    },

    function(errorMessage) {

      // Ignore normal scan messages

    }

  ).catch(function(error) {

    document
      .getElementById("message")
      .innerHTML =
        '<span class="error">' +
        "❌ Camera error: " +
        error +
        "</span>";

  });

}


/************************************************
 * STOP CAMERA
 ************************************************/

function stopScanner() {

  if (scanner) {

    scanner.stop()
      .then(function() {

        scanner.clear();

        scanner = null;

      })
      .catch(function() {

        scanner = null;

      });
  }

  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

}


/************************************************
 * SHOW TYPE SCREEN
 ************************************************/

function showTypeScreen() {

  document
    .getElementById("methodScreen")
    .classList.add("hidden");

  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.remove("hidden");


  document
    .getElementById("palletInput")
    .value = "";

  document
    .getElementById("palletInput")
    .focus();

}


/************************************************
 * SUBMIT TYPED PALLET
 ************************************************/

function submitTypedPallet() {

  const value =
    document
      .getElementById("palletInput")
      .value
      .trim();


  if (!value) {

    document
      .getElementById("message")
      .innerHTML =
        '<span class="error">' +
        "❌ Enter Pallet ID" +
        "</span>";

    return;
  }


  selectedPalletId =
    value.toUpperCase();


  showCapturedPallet();

}


/************************************************
 * SHOW CAPTURED PALLET
 ************************************************/

function showCapturedPallet() {

  document
    .getElementById("methodScreen")
    .classList.add("hidden");

  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  document
    .getElementById("capturedPallet")
    .innerText =
      selectedPalletId;


  document
    .getElementById("message")
    .innerHTML =
      "Pallet ID captured successfully.";

}


/************************************************
 * CHECK PALLET
 *
 * TEMPORARY
 *
 * Backend connection will be added
 * only after Step 1 is confirmed.
 ************************************************/

function checkPallet() {

  document
    .getElementById("message")
    .innerHTML =

      "🔍 Pallet ID received: <b>" +
      escapeHtml(
        selectedPalletId
      ) +
      "</b><br><br>" +

      "Next step: connect this ID to " +
      "PALLET_MASTER.";

}


/************************************************
 * BACK
 ************************************************/

function backToMethod() {

  stopScanner();

  document
    .getElementById("methodScreen")
    .classList.remove("hidden");

  document
    .getElementById("scannerScreen")
    .classList.add("hidden");

  document
    .getElementById("typeScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

}


/************************************************
 * SAFE TEXT
 ************************************************/

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
