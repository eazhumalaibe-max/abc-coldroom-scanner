<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ABC Fruits Cold Room Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  margin: 0;
  padding: 15px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 2px 12px #0002;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  text-align: center;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.scanButton {
  background: #111827;
  color: white;
}

.typeButton {
  background: #2563eb;
  color: white;
}

.saveButton {
  background: #059669;
  color: white;
}

.locationButton {
  background: #7c3aed;
  color: white;
}

.closeButton {
  background: #6b7280;
  color: white;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 18px;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

.result {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: #f1f5f9;
  line-height: 1.8;
  word-break: break-word;
}

.success {
  color: #047857;
  font-weight: bold;
}

.error {
  color: #b91c1c;
  font-weight: bold;
}

.info {
  color: #1d4ed8;
  font-weight: bold;
}

.hidden {
  display: none;
}

.palletCard {
  margin-top: 15px;
  padding: 16px;
  background: #ecfdf5;
  border-radius: 12px;
  line-height: 1.8;
}

.locationCard {
  margin-top: 15px;
  padding: 16px;
  background: #f5f3ff;
  border-radius: 12px;
  line-height: 1.8;
}

</style>

</head>

<body>

<div class="card">

<h1>🍎 ABC Fruits</h1>

<h2>❄️ Cold Room Scanner</h2>


<!-- =========================================
     MAIN SCREEN
     ========================================= -->

<div id="mainScreen">

  <h3>Select Pallet Entry</h3>

  <button
    class="scanButton"
    onclick="startPalletScanner()">

    📷 SCAN PALLET QR

  </button>

  <button
    class="typeButton"
    onclick="showPalletTypeScreen()">

    ⌨️ TYPE PALLET ID

  </button>

</div>


<!-- =========================================
     PALLET CAMERA
     ========================================= -->

<div
  id="palletScannerScreen"
  class="hidden">

  <h3>Scan Pallet QR</h3>

  <div id="reader"></div>

  <button
    class="closeButton"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>

</div>


<!-- =========================================
     PALLET TYPE
     ========================================= -->

<div
  id="palletTypeScreen"
  class="hidden">

  <h3>Enter Pallet ID</h3>

  <input
    id="palletInput"
    type="text"
    placeholder="Example: PAL-000001"
    autocomplete="off"
    autocapitalize="characters">

  <button
    class="typeButton"
    onclick="submitPallet()">

    🔍 CHECK PALLET

  </button>

  <button
    class="closeButton"
    onclick="backHome()">

    ← BACK

  </button>

</div>


<!-- =========================================
     PALLET RESULT
     ========================================= -->

<div
  id="palletResultScreen"
  class="hidden">

  <div
    id="palletResult"
    class="palletCard">
  </div>


  <button
    class="locationButton"
    onclick="showLocationScreen()">

    📍 ASSIGN LOCATION

  </button>


  <button
    class="closeButton"
    onclick="backHome()">

    ← BACK

  </button>

</div>


<!-- =========================================
     LOCATION SCREEN
     ========================================= -->

<div
  id="locationScreen"
  class="hidden">

  <h3>📍 Assign Location</h3>

  <div
    id="selectedPallet"
    class="result">
  </div>


  <button
    class="scanButton"
    onclick="startLocationScanner()">

    📷 SCAN LOCATION QR

  </button>


  <button
    class="typeButton"
    onclick="showLocationTypeScreen()">

    ⌨️ TYPE LOCATION

  </button>


  <button
    class="closeButton"
    onclick="showPalletResult()">

    ← BACK

  </button>

</div>


<!-- =========================================
     LOCATION CAMERA
     ========================================= -->

<div
  id="locationScannerScreen"
  class="hidden">

  <h3>Scan Location QR</h3>

  <div id="locationReader"></div>

  <button
    class="closeButton"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>

</div>


<!-- =========================================
     LOCATION TYPE
     ========================================= -->

<div
  id="locationTypeScreen"
  class="hidden">

  <h3>Enter Location</h3>

  <input
    id="locationInput"
    type="text"
    placeholder="Example: CR01-A01-01"
    autocomplete="off"
    autocapitalize="characters">

  <button
    class="saveButton"
    onclick="submitLocation()">

    💾 SAVE LOCATION

  </button>

  <button
    class="closeButton"
    onclick="showLocationScreen()">

    ← BACK

  </button>

</div>


<!-- =========================================
     LOCATION CONFIRM
     ========================================= -->

<div
  id="locationConfirmScreen"
  class="hidden">

  <div
    id="locationResult"
    class="locationCard">
  </div>


  <button
    class="saveButton"
    onclick="saveLocation()">

    ✅ CONFIRM & SAVE

  </button>


  <button
    class="closeButton"
    onclick="showLocationScreen()">

    ← CHANGE LOCATION

  </button>

</div>


<!-- =========================================
     FINAL RESULT
     ========================================= -->

<div
  id="finalScreen"
  class="hidden">

  <div
    id="finalResult"
    class="result">
  </div>


  <button
    class="typeButton"
    onclick="backHome()">

    🔄 SCAN ANOTHER PALLET

  </button>

</div>


<!-- =========================================
     MESSAGE
     ========================================= -->

<div
  id="message"
  class="result">

  Ready.

</div>

</div>


<script>


/************************************************
 * APPS SCRIPT API
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycby_4imPNgRpoeG9gZ8tfsYcmGye99kaQnW7eGpFQwKPCludkvN-WQxRYZikXkJaD-nt/exec";


/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let scannerType = "";

let currentPallet = null;

let currentLocation = "";


/************************************************
 * SCREEN CONTROL
 ************************************************/

function hideAllScreens() {

  const screens = [

    "mainScreen",

    "palletScannerScreen",

    "palletTypeScreen",

    "palletResultScreen",

    "locationScreen",

    "locationScannerScreen",

    "locationTypeScreen",

    "locationConfirmScreen",

    "finalScreen"

  ];


  screens.forEach(
    function(id) {

      document
        .getElementById(id)
        .classList.add("hidden");

    }
  );

}


/************************************************
 * PALLET SCANNER
 ************************************************/

function startPalletScanner() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "palletScannerScreen"
    )
    .classList.remove("hidden");


  setMessage(
    "📷 Scan Pallet QR..."
  );


  scannerType =
    "pallet";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      const palletId =
        String(
          decodedText
        )
        .trim()
        .toUpperCase();


      stopScanner();


      loadPallet(
        palletId
      );

    },

    function(errorMessage) {

      // Normal scan messages ignored

    }

  )

  .catch(function(error) {

    showError(
      "Pallet camera error: " +
      error
    );

  });

}


/************************************************
 * LOCATION SCANNER
 ************************************************/

function startLocationScanner() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "locationScannerScreen"
    )
    .classList.remove("hidden");


  setMessage(
    "📷 Scan Location QR..."
  );


  scannerType =
    "location";


  scanner =
    new Html5Qrcode(
      "locationReader"
    );


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      const location =
        String(
          decodedText
        )
        .trim()
        .toUpperCase();


      stopScanner();


      confirmLocation(
        location
      );

    },

    function(errorMessage) {

      // Normal scan messages ignored

    }

  )

  .catch(function(error) {

    showError(
      "Location camera error: " +
      error
    );

  });

}


/************************************************
 * STOP SCANNER
 ************************************************/

function stopScanner() {

  if (!scanner) {

    return;

  }


  scanner
    .stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });

}


/************************************************
 * PALLET TYPE SCREEN
 ************************************************/

function showPalletTypeScreen() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "palletTypeScreen"
    )
    .classList.remove("hidden");


  const input =
    document.getElementById(
      "palletInput"
    );


  input.value = "";

  input.focus();


  setMessage(
    "Enter Pallet ID."
  );

}


/************************************************
 * SUBMIT PALLET
 ************************************************/

function submitPallet() {

  const palletId =
    document
      .getElementById(
        "palletInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (!palletId) {

    showError(
      "Please enter Pallet ID."
    );

    return;

  }


  loadPallet(
    palletId
  );

}


/************************************************
 * LOAD PALLET
 ************************************************/

function loadPallet(
  palletId
) {

  hideAllScreens();


  document
    .getElementById(
      "palletResultScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "palletResult"
    )
    .innerHTML =

      '<span class="info">' +

      '🔍 Checking ' +

      '<b>' +

      escapeHtml(
        palletId
      ) +

      '</b>...' +

      '</span>';


  setMessage(
    "Connecting to Google Sheet..."
  );


  const callbackName =
    "palletCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      if (
        data &&
        data.ok === true
      ) {

        currentPallet =
          data;

        showPallet(
          data
        );

      }

      else {

        showError(

          data &&
          data.message
            ? data.message
            : "Pallet not found."

        );

      }


      cleanup();

    };


  const url =

    API_URL +

    "?action=getPallet" +

    "&palletId=" +

    encodeURIComponent(
      palletId
    ) +

    "&prefix=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    url;


  script.async =
    true;


  script.onerror =
    function() {

      showError(
        "Google Apps Script request failed."
      );

      cleanup();

    };


  document
    .head
    .appendChild(
      script
    );


  function cleanup() {

    delete window[
      callbackName
    ];


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SHOW PALLET
 ************************************************/

function showPallet(
  data
) {

  document
    .getElementById(
      "palletResult"
    )
    .innerHTML =

      '<div class="success">' +

      '✅ PALLET FOUND' +

      '</div>' +

      '<br>' +

      '<b>Pallet ID:</b> ' +

      safe(
        data.palletId
      ) +

      '<br>' +

      '<b>Batch:</b> ' +

      safe(
        data.batchId
      ) +

      '<br>' +

      '<b>Product:</b> ' +

      safe(
        data.product
      ) +

      '<br>' +

      '<b>Production Date:</b> ' +

      safe(
        data.productionDate
      ) +

      '<br>' +

      '<b>Box Weight:</b> ' +

      safe(
        data.boxWeight
      ) +

      ' KG' +

      '<br>' +

      '<b>Original Boxes:</b> ' +

      safe(
        data.originalBoxes
      ) +

      '<br>' +

      '<b>Current Boxes:</b> ' +

      safe(
        data.currentBoxes
      ) +

      '<br>' +

      '<b>Current KG:</b> ' +

      safe(
        data.currentKG
      ) +

      ' KG' +

      '<br>' +

      '<b>Current Room:</b> ' +

      safe(
        data.currentRoom
      ) +

      '<br>' +

      '<b>Current Location:</b> ' +

      safe(
        data.currentLocation
      ) +

      '<br>' +

      '<b>Status:</b> ' +

      safe(
        data.status
      );


  setMessage(
    "✅ Pallet data loaded."
  );

}


/************************************************
 * LOCATION SCREEN
 ************************************************/

function showLocationScreen() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "locationScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "selectedPallet"
    )
    .innerHTML =

      '<b>Pallet:</b> ' +

      safe(
        currentPallet.palletId
      ) +

      '<br>' +

      '<b>Product:</b> ' +

      safe(
        currentPallet.product
      );


  setMessage(
    "Select Location QR or type location."
  );

}


/************************************************
 * LOCATION TYPE SCREEN
 ************************************************/

function showLocationTypeScreen() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "locationTypeScreen"
    )
    .classList.remove("hidden");


  const input =
    document.getElementById(
      "locationInput"
    );


  input.value = "";

  input.focus();


  setMessage(
    "Enter Location."
  );

}


/************************************************
 * SUBMIT LOCATION
 ************************************************/

function submitLocation() {

  const location =
    document
      .getElementById(
        "locationInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (!location) {

    showError(
      "Please enter Location."
    );

    return;

  }


  confirmLocation(
    location
  );

}


/************************************************
 * CONFIRM LOCATION
 ************************************************/

function confirmLocation(
  location
) {

  currentLocation =
    location;


  hideAllScreens();


  document
    .getElementById(
      "locationConfirmScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "locationResult"
    )
    .innerHTML =

      '<div class="success">' +

      '📍 LOCATION CAPTURED' +

      '</div>' +

      '<br>' +

      '<b>Pallet:</b> ' +

      safe(
        currentPallet.palletId
      ) +

      '<br>' +

      '<b>Product:</b> ' +

      safe(
        currentPallet.product
      ) +

      '<br>' +

      '<b>Location:</b> ' +

      '<b>' +

      safe(
        currentLocation
      ) +

      '</b>';


  setMessage(
    "Check the location before saving."
  );

}


/************************************************
 * SAVE LOCATION
 ************************************************/

function saveLocation() {

  if (
    !currentPallet ||
    !currentPallet.palletId
  ) {

    showError(
      "Pallet information missing."
    );

    return;

  }


  if (!currentLocation) {

    showError(
      "Location missing."
    );

    return;

  }


  hideAllScreens();


  document
    .getElementById(
      "finalScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "finalResult"
    )
    .innerHTML =

      '<span class="info">' +

      '💾 Saving location...' +

      '</span>';


  const callbackName =
    "locationCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      if (
        data &&
        data.ok === true
      ) {

        document
          .getElementById(
            "finalResult"
          )
          .innerHTML =

            '<div class="success">' +

            '✅ LOCATION SAVED' +

            '</div>' +

            '<br>' +

            '<b>Pallet:</b> ' +

            safe(
              data.palletId
            ) +

            '<br>' +

            '<b>Location:</b> ' +

            safe(
              data.location
            ) +

            '<br><br>' +

            'Google Sheet updated successfully.';

        setMessage(
          "✅ Location saved successfully."
        );

      }

      else {

        showError(

          data &&
          data.message
            ? data.message
            : "Location update failed."

        );

      }


      cleanup();

    };


  const url =

    API_URL +

    "?action=updateLocation" +

    "&palletId=" +

    encodeURIComponent(
      currentPallet.palletId
    ) +

    "&location=" +

    encodeURIComponent(
      currentLocation
    ) +

    "&prefix=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    url;


  script.async =
    true;


  script.onerror =
    function() {

      showError(
        "Google Apps Script location update failed."
      );

      cleanup();

    };


  document
    .head
    .appendChild(
      script
    );


  function cleanup() {

    delete window[
      callbackName
    ];


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SHOW PALLET RESULT
 ************************************************/

function showPalletResult() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "palletResultScreen"
    )
    .classList.remove("hidden");

}


/************************************************
 * BACK HOME
 ************************************************/

function backHome() {

  stopScanner();

  currentPallet = null;

  currentLocation = "";


  hideAllScreens();


  document
    .getElementById(
      "mainScreen"
    )
    .classList.remove("hidden");


  setMessage(
    "Ready."
  );

}


/************************************************
 * ERROR
 ************************************************/

function showError(
  message
) {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "finalScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "finalResult"
    )
    .innerHTML =

      '<span class="error">' +

      '❌ ' +

      escapeHtml(
        message
      ) +

      '</span>';


  setMessage(
    "Operation failed."
  );

}


/************************************************
 * MESSAGE
 ************************************************/

function setMessage(
  message
) {

  document
    .getElementById(
      "message"
    )
    .innerHTML =
      message;

}


/************************************************
 * SAFE VALUE
 ************************************************/

function safe(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


/************************************************
 * ESCAPE HTML
 ************************************************/

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
