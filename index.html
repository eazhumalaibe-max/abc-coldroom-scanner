<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>ABC Fruits - Cold Room</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 30px;
    }

    h2 {
      text-align: center;
      margin: 8px 0 22px;
      font-size: 24px;
    }

    h3 {
      text-align: center;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .scan-button {
      background: #111827;
      color: #ffffff;
    }

    .type-button {
      background: #2563eb;
      color: #ffffff;
    }

    .verify-button {
      background: #059669;
      color: #ffffff;
    }

    .location-button {
      background: #7c3aed;
      color: #ffffff;
    }

    .back-button {
      background: #6b7280;
      color: #ffffff;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    #reader,
    #locationReader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 12px;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #f1f5f9;
      line-height: 1.7;
      font-size: 16px;
    }

    .success {
      color: #047857;
      font-weight: bold;
    }

    .error {
      color: #b91c1c;
      font-weight: bold;
    }

    .info {
      color: #1d4ed8;
      font-weight: bold;
    }

    .details {
      margin-top: 12px;
      line-height: 2;
    }

    .hidden {
      display: none !important;
    }

    .label {
      font-weight: bold;
    }

  </style>

</head>


<body>


<div class="card">


  <!-- =========================================
       HEADER
       ========================================= -->

  <h1>🍎 ABC Fruits</h1>

  <h2>❄️ Cold Room</h2>


  <!-- =========================================
       STEP 1
       PALLET ENTRY METHOD
       ========================================= -->

  <div id="methodScreen">

    <h3>Select Pallet Entry Method</h3>


    <button
      class="scan-button"
      onclick="startPalletScanner()">

      📷 SCAN PALLET QR

    </button>


    <button
      class="type-button"
      onclick="openTypeScreen()">

      ⌨️ TYPE PALLET ID

    </button>

  </div>


  <!-- =========================================
       STEP 2
       PALLET CAMERA
       ========================================= -->

  <div
    id="palletCameraScreen"
    class="hidden">

    <h3>📷 Scan Pallet QR</h3>

    <div id="reader"></div>


    <button
      class="back-button"
      onclick="stopPalletScanner()">

      ✖ CLOSE CAMERA

    </button>

  </div>


  <!-- =========================================
       STEP 3
       TYPE PALLET ID
       ========================================= -->

  <div
    id="typeScreen"
    class="hidden">

    <h3>Enter Pallet ID</h3>


    <input
      id="palletInput"
      type="text"
      placeholder="PAL-000001"
      autocomplete="off"
      autocapitalize="characters">


    <button
      class="verify-button"
      onclick="submitTypedPallet()">

      🔍 VERIFY PALLET

    </button>


    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =========================================
       STEP 4
       PALLET VERIFIED
       ========================================= -->

  <div
    id="palletVerifiedScreen"
    class="hidden">

    <div class="result">

      <div class="success">
        ✅ PALLET ID VERIFIED SUCCESSFULLY
      </div>


      <br>


      <div>
        <span class="label">
          Pallet ID:
        </span>

        <span id="verifiedPalletId"></span>
      </div>


      <div
        id="palletDetails"
        class="details">
      </div>

    </div>


    <button
      class="location-button"
      onclick="startLocationScanner()">

      📍 SCAN LOCATION QR

    </button>


    <button
      class="back-button"
      onclick="goHome()">

      ← BACK

    </button>

  </div>


  <!-- =========================================
       STEP 5
       LOCATION CAMERA
       ========================================= -->

  <div
    id="locationCameraScreen"
    class="hidden">

    <h3>📍 Scan Location QR</h3>


    <div id="locationReader"></div>


    <button
      class="back-button"
      onclick="stopLocationScanner()">

      ✖ CLOSE CAMERA

    </button>

  </div>


  <!-- =========================================
       STEP 6
       LOCATION SUCCESS
       ========================================= -->

  <div
    id="locationSuccessScreen"
    class="hidden">

    <div class="result">

      <div class="success">
        ✅ LOCATION UPDATED SUCCESSFULLY
      </div>


      <div
        id="locationDetails"
        class="details">
      </div>

    </div>


    <button
      class="scan-button"
      onclick="goHome()">

      ✔ DONE

    </button>

  </div>


  <!-- =========================================
       MESSAGE
       ========================================= -->

  <div
    id="message"
    class="result">

    Select Scan or Type Pallet ID.

  </div>


</div>


<script>


/************************************************
 * ABC FRUITS COLD ROOM SCANNER
 ************************************************/


/************************************************
 * IMPORTANT
 *
 * PUT YOUR LATEST /exec URL HERE
 *
 * Example:
 *
 * https://script.google.com/macros/s/XXXXX/exec
 ************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwdsmCQzonGG9mVq_JmU0jOOHKnY2lbxxMOdWWie_J34s_2g3LMNjUKE_w3KOUUN7jD/exec";


/************************************************
 * VARIABLES
 ************************************************/

let palletScanner = null;

let locationScanner = null;

let selectedPalletId = "";

let palletData = null;


/************************************************
 * START PALLET CAMERA
 ************************************************/

function startPalletScanner() {

  hideAllScreens();


  document
    .getElementById(
      "palletCameraScreen"
    )
    .classList.remove(
      "hidden"
    );


  setMessage(
    "📷 Opening live pallet camera...",
    "info"
  );


  palletScanner =
    new Html5Qrcode(
      "reader"
    );


  palletScanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      /*
       * Your pallet QR contains
       *
       * PAL-000001
       */

      selectedPalletId =
        String(decodedText)
          .trim()
          .toUpperCase();


      stopPalletScanner();


      /*
       * Automatically verify
       */

      verifyPallet();

    },

    function(errorMessage) {

      /*
       * Ignore normal scanner messages.
       */

    }

  )

  .catch(function(error) {

    setMessage(
      "❌ Pallet camera error: " +
      String(error),
      "error"
    );

  });

}


/************************************************
 * STOP PALLET CAMERA
 ************************************************/

function stopPalletScanner() {

  if (!palletScanner) {

    document
      .getElementById(
        "palletCameraScreen"
      )
      .classList.add(
        "hidden"
      );

    return;

  }


  palletScanner
    .stop()

    .then(function() {

      try {

        palletScanner.clear();

      }

      catch (e) {}

      palletScanner = null;

    })

    .catch(function() {

      palletScanner = null;

    });


  document
    .getElementById(
      "palletCameraScreen"
    )
    .classList.add(
      "hidden"
    );

}


/************************************************
 * OPEN TYPE PALLET
 ************************************************/

function openTypeScreen() {

  stopPalletScanner();


  hideAllScreens();


  document
    .getElementById(
      "typeScreen"
    )
    .classList.remove(
      "hidden"
    );


  const input =
    document.getElementById(
      "palletInput"
    );


  input.value = "";


  setMessage(
    "Enter Pallet ID.",
    "info"
  );


  setTimeout(function() {

    input.focus();

  }, 200);

}


/************************************************
 * SUBMIT TYPED PALLET
 ************************************************/

function submitTypedPallet() {

  let value =
    document
      .getElementById(
        "palletInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (!value) {

    setMessage(
      "❌ Please enter Pallet ID.",
      "error"
    );

    return;

  }


  selectedPalletId =
    value;


  /*
   * Automatically verify
   */

  verifyPallet();

}


/************************************************
 * VERIFY PALLET
 ************************************************/

function verifyPallet() {

  if (!selectedPalletId) {

    setMessage(
      "❌ Pallet ID is empty.",
      "error"
    );

    return;

  }


  hideAllScreens();


  setMessage(
    "🔍 Checking Pallet ID " +
    escapeHtml(
      selectedPalletId
    ) +
    "...",
    "info"
  );


  /*
   * Unique JSONP callback
   */

  const callbackName =
    "abcPalletVerify_" +
    Date.now();


  let completed = false;


  /*
   * JSONP callback
   */

  window[callbackName] =
    function(data) {

      if (completed) {
        return;
      }


      completed = true;


      console.log(
        "ABC Fruits Pallet Response:",
        data
      );


      /*
       * PALLET FOUND
       */

      if (
        data &&
        data.ok === true
      ) {

        palletData =
          data;


        showPalletVerified();


        cleanup();


        return;

      }


      /*
       * PALLET NOT FOUND
       */

      setMessage(
        "❌ " +
        (
          data &&
          data.message
            ? data.message
            : "Pallet not found."
        ),
        "error"
      );


      showMethodScreen();


      cleanup();

    };


  /*
   * Request:
   *
   * /pallet/PAL-000001
   *
   * ?prefix=callback
   */

  const requestUrl =
    API_URL +
    "/pallet/" +
    encodeURIComponent(
      selectedPalletId
    ) +
    "?prefix=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "Pallet Request:",
    requestUrl
  );


  /*
   * JSONP script
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    requestUrl;


  script.async = true;


  /*
   * Request failed
   */

  script.onerror =
    function() {

      if (completed) {
        return;
      }


      completed = true;


      setMessage(
        "❌ Pallet API request failed.",
        "error"
      );


      showMethodScreen();


      cleanup();

    };


  document
    .body
    .appendChild(
      script
    );


  /*
   * 15 second timeout
   */

  setTimeout(
    function() {

      if (completed) {
        return;
      }


      const existing =
        document.getElementById(
          callbackName
        );


      if (existing) {

        completed = true;


        setMessage(
          "❌ Pallet API timeout.",
          "error"
        );


        showMethodScreen();


        cleanup();

      }

    },
    15000
  );


  /*
   * Cleanup
   */

  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SHOW PALLET VERIFIED
 ************************************************/

function showPalletVerified() {

  hideAllScreens();


  document
    .getElementById(
      "palletVerifiedScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "verifiedPalletId"
    )
    .innerText =
      palletData.palletId;


  document
    .getElementById(
      "palletDetails"
    )
    .innerHTML =

      "<b>Batch ID:</b> " +
      safe(
        palletData.batchId
      ) +

      "<br>" +

      "<b>Product:</b> " +
      safe(
        palletData.product
      ) +

      "<br>" +

      "<b>Production Date:</b> " +
      safe(
        palletData.productionDate
      ) +

      "<br>" +

      "<b>Box Weight:</b> " +
      safe(
        palletData.boxWeightKG
      ) +
      " KG" +

      "<br>" +

      "<b>Original Boxes:</b> " +
      safe(
        palletData.originalBoxes
      ) +

      "<br>" +

      "<b>Current Boxes:</b> " +
      safe(
        palletData.currentBoxes
      ) +

      "<br>" +

      "<b>Current KG:</b> " +
      safe(
        palletData.currentKG
      ) +
      " KG" +

      "<br>" +

      "<b>Current Room:</b> " +
      safe(
        palletData.currentRoom ||
        "-"
      ) +

      "<br>" +

      "<b>Current Location:</b> " +
      safe(
        palletData.currentLocation ||
        "-"
      ) +

      "<br>" +

      "<b>Status:</b> " +
      safe(
        palletData.status
      );


  setMessage(
    "✅ Pallet ID verified successfully. Scan Location QR.",
    "success"
  );

}


/************************************************
 * START LOCATION CAMERA
 ************************************************/

function startLocationScanner() {

  hideAllScreens();


  document
    .getElementById(
      "locationCameraScreen"
    )
    .classList.remove(
      "hidden"
    );


  setMessage(
    "📍 Opening live location camera...",
    "info"
  );


  locationScanner =
    new Html5Qrcode(
      "locationReader"
    );


  locationScanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      /*
       * Example location QR:
       *
       * CR01-A01-01
       */

      const locationId =
        String(decodedText)
          .trim()
          .toUpperCase();


      stopLocationScanner();


      updatePalletLocation(
        locationId
      );

    },

    function(errorMessage) {

      /*
       * Ignore normal scanner messages.
       */

    }

  )

  .catch(function(error) {

    setMessage(
      "❌ Location camera error: " +
      String(error),
      "error"
    );

  });

}


/************************************************
 * STOP LOCATION CAMERA
 ************************************************/

function stopLocationScanner() {

  if (!locationScanner) {

    document
      .getElementById(
        "locationCameraScreen"
      )
      .classList.add(
        "hidden"
      );

    return;

  }


  locationScanner
    .stop()

    .then(function() {

      try {

        locationScanner.clear();

      }

      catch (e) {}

      locationScanner = null;

    })

    .catch(function() {

      locationScanner = null;

    });


  document
    .getElementById(
      "locationCameraScreen"
    )
    .classList.add(
      "hidden"
    );

}


/************************************************
 * UPDATE PALLET LOCATION
 ************************************************/

function updatePalletLocation(
  locationId
) {

  if (!selectedPalletId) {

    setMessage(
      "❌ Pallet ID missing.",
      "error"
    );

    return;

  }


  if (!locationId) {

    setMessage(
      "❌ Location QR is empty.",
      "error"
    );

    return;

  }


  hideAllScreens();


  setMessage(
    "💾 Saving location " +
    escapeHtml(
      locationId
    ) +
    "...",
    "info"
  );


  /*
   * Unique callback
   */

  const callbackName =
    "abcLocationUpdate_" +
    Date.now();


  let completed = false;


  /*
   * JSONP callback
   */

  window[callbackName] =
    function(data) {

      if (completed) {
        return;
      }


      completed = true;


      console.log(
        "ABC Fruits Location Response:",
        data
      );


      /*
       * SUCCESS
       */

      if (
        data &&
        data.ok === true
      ) {

        showLocationSuccess(
          data
        );


        cleanup();


        return;

      }


      /*
       * ERROR
       */

      setMessage(
        "❌ " +
        (
          data &&
          data.message
            ? data.message
            : "Location update failed."
        ),
        "error"
      );


      showPalletVerified();


      cleanup();

    };


  /*
   * Request:
   *
   * /setPallet/PAL-000001/location/CR01-A01-01
   */

  const requestUrl =
    API_URL +
    "/setPallet/" +
    encodeURIComponent(
      selectedPalletId
    ) +
    "/location/" +
    encodeURIComponent(
      locationId
    ) +
    "?prefix=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "Location Request:",
    requestUrl
  );


  /*
   * JSONP script
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    requestUrl;


  script.async = true;


  /*
   * Request failed
   */

  script.onerror =
    function() {

      if (completed) {
        return;
      }


      completed = true;


      setMessage(
        "❌ Location API request failed.",
        "error"
      );


      showPalletVerified();


      cleanup();

    };


  document
    .body
    .appendChild(
      script
    );


  /*
   * Timeout
   */

  setTimeout(
    function() {

      if (completed) {
        return;
      }


      const existing =
        document.getElementById(
          callbackName
        );


      if (existing) {

        completed = true;


        setMessage(
          "❌ Location API timeout.",
          "error"
        );


        showPalletVerified();


        cleanup();

      }

    },
    15000
  );


  /*
   * Cleanup
   */

  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * LOCATION SUCCESS
 ************************************************/

function showLocationSuccess(
  data
) {

  hideAllScreens();


  document
    .getElementById(
      "locationSuccessScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "locationDetails"
    )
    .innerHTML =

      "<b>Pallet ID:</b> " +
      safe(
        data.palletId
      ) +

      "<br>" +

      "<b>Location QR:</b> " +
      safe(
        data.locationId
      ) +

      "<br>" +

      "<b>Current Room:</b> " +
      safe(
        data.currentRoom
      ) +

      "<br>" +

      "<b>Current Location:</b> " +
      safe(
        data.currentLocation
      );


  setMessage(
    "✅ Location saved successfully.",
    "success"
  );

}


/************************************************
 * HOME
 ************************************************/

function goHome() {

  stopPalletScanner();

  stopLocationScanner();


  selectedPalletId = "";

  palletData = null;


  hideAllScreens();


  document
    .getElementById(
      "methodScreen"
    )
    .classList.remove(
      "hidden"
    );


  setMessage(
    "Select Scan or Type Pallet ID.",
    "info"
  );

}


/************************************************
 * SHOW METHOD SCREEN
 ************************************************/

function showMethodScreen() {

  hideAllScreens();


  document
    .getElementById(
      "methodScreen"
    )
    .classList.remove(
      "hidden"
    );

}


/************************************************
 * HIDE ALL SCREENS
 ************************************************/

function hideAllScreens() {

  document
    .getElementById(
      "methodScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "palletCameraScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "typeScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "palletVerifiedScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "locationCameraScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "locationSuccessScreen"
    )
    .classList.add(
      "hidden"
    );

}


/************************************************
 * MESSAGE
 ************************************************/

function setMessage(
  message,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML =
    message;


  box.className =
    "result";


  if (
    type === "success"
  ) {

    box.classList.add(
      "success"
    );

  }

  else if (
    type === "error"
  ) {

    box.classList.add(
      "error"
    );

  }

  else {

    box.classList.add(
      "info"
    );

  }

}


/************************************************
 * SAFE HTML
 ************************************************/

function safe(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
