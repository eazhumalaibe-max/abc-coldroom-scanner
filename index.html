<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ABC Fruits Cold Room Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 15px;
    }

    .card {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 2px 12px #0002;
    }

    h1, h2 {
      text-align: center;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .scan {
      background: #111827;
      color: white;
    }

    .close {
      background: #6b7280;
      color: white;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #f1f5f9;
      line-height: 1.8;
      font-size: 16px;
    }

    .success {
      color: #047857;
      font-weight: bold;
      font-size: 19px;
    }

    .error {
      color: #b91c1c;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🍎 ABC Fruits</h1>

  <h2>❄️ Cold Room Scanner</h2>

  <button
    class="scan"
    onclick="startScanner()">
    📷 SCAN PALLET QR
  </button>

  <div id="reader" class="hidden"></div>

  <button
    id="closeButton"
    class="close hidden"
    onclick="stopScanner()">
    ✖ CLOSE CAMERA
  </button>

  <div id="result" class="result">
    Scan a pallet QR.
  </div>

</div>


<script>

/************************************************
 * GOOGLE APPS SCRIPT WEB APP
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbwcKf7tvHMhWAazmLMj7jUuKfxGnJ-NnJfIhOXL08dGDeGS1LNDXcJka6jTM11yBvzk/exec";


let scanner = null;


/************************************************
 * START CAMERA
 ************************************************/

function startScanner() {

  document
    .getElementById("reader")
    .classList.remove("hidden");

  document
    .getElementById("closeButton")
    .classList.remove("hidden");

  document
    .getElementById("result")
    .innerHTML =
      "📷 Opening camera...";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      stopScanner();

      getPallet(decodedText);

    },

    function(error) {

      // Normal QR scanning errors ignored

    }

  ).catch(function(error) {

    document
      .getElementById("result")
      .innerHTML =
        '<span class="error">' +
        "❌ Camera error: " +
        error +
        "</span>";

  });

}


/************************************************
 * STOP CAMERA
 ************************************************/

function stopScanner() {

  if (scanner) {

    scanner
      .stop()
      .then(function() {

        scanner.clear();

      })
      .catch(function() {});

    scanner = null;
  }


  document
    .getElementById("reader")
    .classList.add("hidden");


  document
    .getElementById("closeButton")
    .classList.add("hidden");
}


/************************************************
 * GET PALLET
 ************************************************/

function getPallet(palletId) {

  palletId =
    String(palletId || "").trim();


  document
    .getElementById("result")
    .innerHTML =
      "🔍 Checking <b>" +
      palletId +
      "</b>...";


  /*
   * Create unique callback name
   */

  const callbackName =
    "abcPallet_" +
    Date.now();


  /*
   * Create callback function
   */

  window[callbackName] =
    function(data) {

      console.log(
        "Apps Script response:",
        data
      );


      if (
        data &&
        data.ok === true
      ) {

        document
          .getElementById("result")
          .innerHTML =

          '<div class="success">' +
          "✅ PALLET FOUND" +
          "</div>" +

          "<b>Pallet:</b> " +
          show(data.palletId) +
          "<br>" +

          "<b>Product:</b> " +
          show(data.product) +
          "<br>" +

          "<b>Batch:</b> " +
          show(data.batchId) +
          "<br>" +

          "<b>Box Weight:</b> " +
          show(data.boxWeight) +
          " KG<br>" +

          "<b>Original Boxes:</b> " +
          show(data.originalBoxes) +
          "<br>" +

          "<b>Current Boxes:</b> " +
          show(data.currentBoxes) +
          "<br>" +

          "<b>Current KG:</b> " +
          show(data.currentKG) +
          " KG<br>" +

          "<b>Room:</b> " +
          show(data.currentRoom) +
          "<br>" +

          "<b>Location:</b> " +
          show(data.currentLocation) +
          "<br>" +

          "<b>Status:</b> " +
          show(data.status);

      }

      else {

        document
          .getElementById("result")
          .innerHTML =

          '<span class="error">' +
          "❌ " +
          show(
            data && data.message
              ? data.message
              : "Pallet not found"
          ) +
          "</span>";

      }


      cleanup();

    };


  /*
   * Create script element
   *
   * This is JSONP.
   */

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?action=getPallet" +
    "&palletId=" +
    encodeURIComponent(palletId) +
    "&callback=" +
    callbackName +
    "&v=" +
    Date.now();


  /*
   * If browser cannot load Apps Script
   */

  script.onerror =
    function() {

      document
        .getElementById("result")
        .innerHTML =

        '<span class="error">' +

        "❌ Could not connect to Google Sheet." +

        "<br><br>" +

        "Apps Script request failed."

        + "</span>";


      cleanup();

    };


  document
    .body
    .appendChild(script);


  /*
   * Timeout
   */

  setTimeout(function() {

    if (
      document.getElementById(
        callbackName
      )
    ) {

      document
        .getElementById("result")
        .innerHTML =

        '<span class="error">' +

        "❌ No response from Google Sheet."

        + "</span>";

      cleanup();

    }

  }, 15000);


  function cleanup() {

    try {

      delete window[callbackName];

    } catch (e) {}


    const oldScript =
      document.getElementById(
        callbackName
      );


    if (oldScript) {

      oldScript.remove();

    }

  }

}


/************************************************
 * SAFE DISPLAY
 ************************************************/

function show(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";
  }


  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
