<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ABC Fruits Cold Room Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  margin: 0;
  padding: 15px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 2px 12px #0002;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  text-align: center;
  margin-top: 5px;
}

h3 {
  margin-top: 20px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.scanButton {
  background: #111827;
  color: white;
}

.typeButton {
  background: #2563eb;
  color: white;
}

.locationButton {
  background: #7c3aed;
  color: white;
}

.saveButton {
  background: #059669;
  color: white;
}

.closeButton {
  background: #6b7280;
  color: white;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 18px;
}

#reader,
#locationReader {
  width: 100%;
  margin-top: 15px;
}

.result {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: #f1f5f9;
  line-height: 1.8;
  word-break: break-word;
}

.palletCard {
  margin-top: 15px;
  padding: 16px;
  background: #ecfdf5;
  border-radius: 12px;
  line-height: 1.8;
}

.locationCard {
  margin-top: 15px;
  padding: 16px;
  background: #f5f3ff;
  border-radius: 12px;
  line-height: 1.8;
}

.success {
  color: #047857;
  font-weight: bold;
}

.error {
  color: #b91c1c;
  font-weight: bold;
}

.info {
  color: #1d4ed8;
  font-weight: bold;
}

.hidden {
  display: none;
}

.small {
  font-size: 13px;
  color: #6b7280;
  margin-top: 12px;
  text-align: center;
}

</style>

</head>

<body>

<div class="card">

<h1>🍎 ABC Fruits</h1>

<h2>❄️ Cold Room Scanner</h2>


<!-- ==================================================
     HOME
================================================== -->

<div id="mainScreen">

  <h3>Pallet Entry</h3>

  <button
    class="scanButton"
    onclick="startPalletScanner()">

    📷 SCAN PALLET QR

  </button>

  <button
    class="typeButton"
    onclick="showPalletTypeScreen()">

    ⌨️ TYPE PALLET ID

  </button>

</div>


<!-- ==================================================
     PALLET CAMERA
================================================== -->

<div
  id="palletScannerScreen"
  class="hidden">

  <h3>📷 Scan Pallet QR</h3>

  <div id="reader"></div>

  <button
    class="closeButton"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>

</div>


<!-- ==================================================
     PALLET MANUAL ENTRY
================================================== -->

<div
  id="palletTypeScreen"
  class="hidden">

  <h3>⌨️ Enter Pallet ID</h3>

  <input
    id="palletInput"
    type="text"
    placeholder="PAL-000001"
    autocomplete="off"
    autocapitalize="characters">

  <button
    class="typeButton"
    onclick="submitPallet()">

    🔍 CHECK PALLET

  </button>

  <button
    class="closeButton"
    onclick="backHome()">

    ← BACK

  </button>

</div>


<!-- ==================================================
     PALLET RESULT
================================================== -->

<div
  id="palletResultScreen"
  class="hidden">

  <div
    id="palletResult"
    class="palletCard">
  </div>

  <button
    class="locationButton"
    onclick="showLocationScreen()">

    📍 ASSIGN LOCATION

  </button>

  <button
    class="closeButton"
    onclick="backHome()">

    ← BACK

  </button>

</div>


<!-- ==================================================
     LOCATION MENU
================================================== -->

<div
  id="locationScreen"
  class="hidden">

  <h3>📍 Assign Location</h3>

  <div
    id="selectedPallet"
    class="result">
  </div>

  <button
    class="scanButton"
    onclick="startLocationScanner()">

    📷 SCAN LOCATION QR

  </button>

  <button
    class="typeButton"
    onclick="showLocationTypeScreen()">

    ⌨️ TYPE LOCATION

  </button>

  <button
    class="closeButton"
    onclick="showPalletResult()">

    ← BACK

  </button>

</div>


<!-- ==================================================
     LOCATION CAMERA
================================================== -->

<div
  id="locationScannerScreen"
  class="hidden">

  <h3>📍 Scan Location QR</h3>

  <div id="locationReader"></div>

  <button
    class="closeButton"
    onclick="stopScanner()">

    ✖ CLOSE CAMERA

  </button>

</div>


<!-- ==================================================
     LOCATION MANUAL ENTRY
================================================== -->

<div
  id="locationTypeScreen"
  class="hidden">

  <h3>⌨️ Enter Location</h3>

  <input
    id="locationInput"
    type="text"
    placeholder="CR01-A01-01"
    autocomplete="off"
    autocapitalize="characters">

  <button
    class="saveButton"
    onclick="submitLocation()">

    ➡️ CONTINUE

  </button>

  <button
    class="closeButton"
    onclick="showLocationScreen()">

    ← BACK

  </button>

</div>


<!-- ==================================================
     LOCATION CONFIRM
================================================== -->

<div
  id="locationConfirmScreen"
  class="hidden">

  <h3>Confirm Location</h3>

  <div
    id="locationResult"
    class="locationCard">
  </div>

  <button
    class="saveButton"
    onclick="saveLocation()">

    ✅ CONFIRM & SAVE

  </button>

  <button
    class="closeButton"
    onclick="showLocationScreen()">

    ← CHANGE LOCATION

  </button>

</div>


<!-- ==================================================
     FINAL RESULT
================================================== -->

<div
  id="finalScreen"
  class="hidden">

  <div
    id="finalResult"
    class="result">
  </div>

  <button
    class="typeButton"
    onclick="backHome()">

    🔄 SCAN ANOTHER PALLET

  </button>

</div>


<!-- ==================================================
     STATUS
================================================== -->

<div
  id="message"
  class="result">

  Ready.

</div>

<div class="small">
  ABC Fruits Inventory System
</div>

</div>


<script>


/*******************************************************
 * GOOGLE APPS SCRIPT URL
 *******************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbyVmzPdmoHxO6a0jvhhB2b30-yogaTjPcMDKVxb1NVeAmTJkotvMIOgVgVRW0iYABo/exec";


/*******************************************************
 * VARIABLES
 *******************************************************/

let scanner = null;

let currentPallet = null;

let currentLocation = "";

let requestTimer = null;


/*******************************************************
 * HIDE ALL SCREENS
 *******************************************************/

function hideAllScreens() {

  const ids = [

    "mainScreen",

    "palletScannerScreen",

    "palletTypeScreen",

    "palletResultScreen",

    "locationScreen",

    "locationScannerScreen",

    "locationTypeScreen",

    "locationConfirmScreen",

    "finalScreen"

  ];


  ids.forEach(function(id) {

    document
      .getElementById(id)
      .classList.add("hidden");

  });

}


/*******************************************************
 * PALLET CAMERA
 *******************************************************/

function startPalletScanner() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById("palletScannerScreen")
    .classList.remove("hidden");


  setMessage(
    "📷 Scan Pallet QR..."
  );


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      const palletId =
        String(decodedText)
          .trim()
          .toUpperCase();


      stopScanner();

      loadPallet(
        palletId
      );

    },

    function(errorMessage) {

      // Ignore normal scanner messages

    }

  )

  .catch(function(error) {

    showError(
      "Camera error: " +
      error
    );

  });

}


/*******************************************************
 * LOCATION CAMERA
 *******************************************************/

function startLocationScanner() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById("locationScannerScreen")
    .classList.remove("hidden");


  setMessage(
    "📷 Scan Location QR..."
  );


  scanner =
    new Html5Qrcode(
      "locationReader"
    );


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      const location =
        String(decodedText)
          .trim()
          .toUpperCase();


      stopScanner();

      confirmLocation(
        location
      );

    },

    function(errorMessage) {

      // Ignore normal scanner messages

    }

  )

  .catch(function(error) {

    showError(
      "Location camera error: " +
      error
    );

  });

}


/*******************************************************
 * STOP CAMERA
 *******************************************************/

function stopScanner() {

  if (!scanner) {
    return;
  }


  scanner
    .stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });

}


/*******************************************************
 * PALLET MANUAL SCREEN
 *******************************************************/

function showPalletTypeScreen() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById("palletTypeScreen")
    .classList.remove("hidden");


  const input =
    document.getElementById(
      "palletInput"
    );


  input.value = "";

  input.focus();


  setMessage(
    "Enter Pallet ID."
  );

}


/*******************************************************
 * SUBMIT PALLET
 *******************************************************/

function submitPallet() {

  const palletId =
    document
      .getElementById(
        "palletInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (!palletId) {

    showError(
      "Please enter Pallet ID."
    );

    return;

  }


  loadPallet(
    palletId
  );

}


/*******************************************************
 * GET PALLET FROM GOOGLE SHEET
 *******************************************************/

function loadPallet(
  palletId
) {

  hideAllScreens();


  document
    .getElementById(
      "palletResultScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "palletResult"
    )
    .innerHTML =

      '<span class="info">' +

      '🔍 Checking pallet ' +

      '<b>' +

      escapeHtml(
        palletId
      ) +

      '</b>...' +

      '</span>';


  setMessage(
    "Connecting to Google Sheet..."
  );


  const callbackName =
    "abcPallet_" +
    Date.now();


  window[callbackName] =
    function(data) {

      clearTimeout(
        requestTimer
      );


      if (
        data &&
        data.ok === true
      ) {

        currentPallet =
          data;


        showPallet(
          data
        );

      }

      else {

        showError(

          data &&
          data.message

            ? data.message

            : "Pallet not found."

        );

      }


      cleanup(
        callbackName
      );

    };


  const url =

    API_URL +

    "?action=getPallet" +

    "&palletId=" +

    encodeURIComponent(
      palletId
    ) +

    "&prefix=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.type =
    "text/javascript";


  script.async =
    true;


  script.src =
    url;


  script.onerror =
    function() {

      clearTimeout(
        requestTimer
      );


      showError(
        "Could not connect to ABC Fruits server."
      );


      cleanup(
        callbackName
      );

    };


  document
    .head
    .appendChild(
      script
    );


  requestTimer =
    setTimeout(function() {

      showError(
        "Google Apps Script response timeout."
      );


      cleanup(
        callbackName
      );

    }, 15000);

}


/*******************************************************
 * SHOW PALLET
 *******************************************************/

function showPallet(
  data
) {

  document
    .getElementById(
      "palletResult"
    )
    .innerHTML =

      '<div class="success">' +

      '✅ PALLET FOUND' +

      '</div>' +

      '<br>' +

      '<b>Pallet ID:</b> ' +

      safe(
        data.palletId
      ) +

      '<br>' +

      '<b>Batch ID:</b> ' +

      safe(
        data.batchId
      ) +

      '<br>' +

      '<b>Product:</b> ' +

      safe(
        data.product
      ) +

      '<br>' +

      '<b>Production Date:</b> ' +

      safe(
        data.productionDate
      ) +

      '<br>' +

      '<b>Box Weight:</b> ' +

      safe(
        data.boxWeight
      ) +

      ' KG' +

      '<br>' +

      '<b>Original Boxes:</b> ' +

      safe(
        data.originalBoxes
      ) +

      '<br>' +

      '<b>Current Boxes:</b> ' +

      safe(
        data.currentBoxes
      ) +

      '<br>' +

      '<b>Current KG:</b> ' +

      safe(
        data.currentKG
      ) +

      ' KG' +

      '<br>' +

      '<b>Current Room:</b> ' +

      safe(
        data.currentRoom
      ) +

      '<br>' +

      '<b>Current Location:</b> ' +

      safe(
        data.currentLocation
      ) +

      '<br>' +

      '<b>Status:</b> ' +

      safe(
        data.status
      );


  setMessage(
    "✅ Pallet data loaded."
  );

}


/*******************************************************
 * LOCATION MENU
 *******************************************************/

function showLocationScreen() {

  stopScanner();

  hideAllScreens();


  if (
    !currentPallet
  ) {

    showError(
      "Pallet information is missing."
    );

    return;

  }


  document
    .getElementById(
      "locationScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "selectedPallet"
    )
    .innerHTML =

      '<b>Pallet:</b> ' +

      safe(
        currentPallet.palletId
      ) +

      '<br>' +

      '<b>Product:</b> ' +

      safe(
        currentPallet.product
      ) +

      '<br>' +

      '<b>Current Location:</b> ' +

      safe(
        currentPallet.currentLocation
      );


  setMessage(
    "Select Location QR or type location."
  );

}


/*******************************************************
 * LOCATION MANUAL ENTRY
 *******************************************************/

function showLocationTypeScreen() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "locationTypeScreen"
    )
    .classList.remove("hidden");


  const input =
    document.getElementById(
      "locationInput"
    );


  input.value = "";

  input.focus();


  setMessage(
    "Enter Location."
  );

}


/*******************************************************
 * SUBMIT LOCATION
 *******************************************************/

function submitLocation() {

  const location =
    document
      .getElementById(
        "locationInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (!location) {

    showError(
      "Please enter Location."
    );

    return;

  }


  confirmLocation(
    location
  );

}


/*******************************************************
 * CONFIRM LOCATION
 *******************************************************/

function confirmLocation(
  location
) {

  currentLocation =
    location;


  hideAllScreens();


  document
    .getElementById(
      "locationConfirmScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "locationResult"
    )
    .innerHTML =

      '<div class="success">' +

      '📍 LOCATION CAPTURED' +

      '</div>' +

      '<br>' +

      '<b>Pallet:</b> ' +

      safe(
        currentPallet.palletId
      ) +

      '<br>' +

      '<b>Product:</b> ' +

      safe(
        currentPallet.product
      ) +

      '<br>' +

      '<b>Location:</b> ' +

      '<b>' +

      safe(
        currentLocation
      ) +

      '</b>';


  setMessage(
    "Check location before saving."
  );

}


/*******************************************************
 * SAVE LOCATION
 *******************************************************/

function saveLocation() {

  if (
    !currentPallet ||
    !currentPallet.palletId
  ) {

    showError(
      "Pallet information missing."
    );

    return;

  }


  if (!currentLocation) {

    showError(
      "Location is missing."
    );

    return;

  }


  hideAllScreens();


  document
    .getElementById(
      "finalScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "finalResult"
    )
    .innerHTML =

      '<span class="info">' +

      '💾 Saving location...' +

      '</span>';


  setMessage(
    "Updating Google Sheet..."
  );


  const callbackName =
    "abcLocation_" +
    Date.now();


  window[callbackName] =
    function(data) {

      clearTimeout(
        requestTimer
      );


      console.log(
        "LOCATION RESPONSE:",
        data
      );


      if (
        data &&
        data.ok === true
      ) {

        /*
         * Update local pallet data
         */

        currentPallet.currentLocation =
          data.location;


        document
          .getElementById(
            "finalResult"
          )
          .innerHTML =

            '<div class="success">' +

            '✅ LOCATION SAVED' +

            '</div>' +

            '<br>' +

            '<b>Pallet:</b> ' +

            safe(
              data.palletId
            ) +

            '<br>' +

            '<b>Location:</b> ' +

            safe(
              data.location
            ) +

            '<br>' +

            '<b>Action:</b> ' +

            safe(
              data.action
            ) +

            '<br>' +

            '<b>Boxes:</b> ' +

            safe(
              data.boxes
            ) +

            '<br>' +

            '<b>KG:</b> ' +

            safe(
              data.kg
            ) +

            '<br><br>' +

            '✅ PALLET_MASTER updated' +

            '<br>' +

            '✅ TRANSACTION recorded';


        setMessage(
          "✅ Google Sheet updated successfully."
        );

      }

      else {

        showError(

          data &&
          data.message

            ? data.message

            : "Location update failed."

        );

      }


      cleanup(
        callbackName
      );

    };


  /*
   * IMPORTANT:
   *
   * Empty operator and dispatch number
   * are sent for now.
   */

  const url =

    API_URL +

    "?action=updateLocation" +

    "&palletId=" +

    encodeURIComponent(
      currentPallet.palletId
    ) +

    "&location=" +

    encodeURIComponent(
      currentLocation
    ) +

    "&operator=" +

    encodeURIComponent(
      ""
    ) +

    "&dispatchNo=" +

    encodeURIComponent(
      ""
    ) +

    "&prefix=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  console.log(
    "LOCATION SAVE URL:",
    url
  );


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.type =
    "text/javascript";


  script.async =
    true;


  script.src =
    url;


  script.onerror =
    function() {

      clearTimeout(
        requestTimer
      );


      showError(
        "Could not connect to ABC Fruits server while saving location."
      );


      cleanup(
        callbackName
      );

    };


  document
    .head
    .appendChild(
      script
    );


  requestTimer =
    setTimeout(function() {

      showError(
        "Location save response timeout."
      );


      cleanup(
        callbackName
      );

    }, 15000);

}


/*******************************************************
 * BACK TO PALLET RESULT
 *******************************************************/

function showPalletResult() {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "palletResultScreen"
    )
    .classList.remove("hidden");

}


/*******************************************************
 * BACK HOME
 *******************************************************/

function backHome() {

  stopScanner();


  currentPallet =
    null;


  currentLocation =
    "";


  hideAllScreens();


  document
    .getElementById(
      "mainScreen"
    )
    .classList.remove("hidden");


  setMessage(
    "Ready."
  );

}


/*******************************************************
 * GENERIC ERROR
 *******************************************************/

function showError(
  message
) {

  stopScanner();

  hideAllScreens();


  document
    .getElementById(
      "finalScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "finalResult"
    )
    .innerHTML =

      '<span class="error">' +

      '❌ ' +

      escapeHtml(
        message
      ) +

      '</span>';


  setMessage(
    "Operation failed."
  );

}


/*******************************************************
 * CLEANUP JSONP
 *******************************************************/

function cleanup(
  callbackName
) {

  try {

    delete window[
      callbackName
    ];

  }

  catch (error) {

    console.log(
      error
    );

  }


  const script =
    document.getElementById(
      callbackName
    );


  if (script) {

    script.remove();

  }


  requestTimer =
    null;

}


/*******************************************************
 * STATUS MESSAGE
 *******************************************************/

function setMessage(
  message
) {

  document
    .getElementById(
      "message"
    )
    .innerHTML =
      message;

}


/*******************************************************
 * SAFE VALUE
 *******************************************************/

function safe(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return escapeHtml(
    String(value)
  );

}


/*******************************************************
 * ESCAPE HTML
 *******************************************************/

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
